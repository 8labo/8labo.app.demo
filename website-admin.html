<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホームページ管理｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#075ea8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}.back{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:linear-gradient(135deg,#071b33,#075ea8);color:#fff;border-radius:22px;padding:26px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dbeafe;font-size:12px}.preview-link{display:inline-block;margin-top:12px;color:#fff;font-size:11px}.status{margin:14px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:11px}.ok{background:#f0fdf4}.err{background:#fef2f2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;font-size:11px;cursor:pointer}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:17px;margin:0 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.7}.field{margin:12px 0}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;font:inherit}.field textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:900;font-size:10px;cursor:pointer}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff;color:#111827;border:1px solid var(--line)}.btn.danger{background:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.news-item,.media-item{padding:13px 0;border-top:1px solid #eef1f4}.news-item:first-child,.media-item:first-child{border-top:0}.news-item h3{font-size:13px;margin:5px 0}.meta{font-size:9px;color:var(--muted)}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f7;font-size:8px;font-weight:800;margin-right:5px}.badge.live{background:#dcfce7;color:#166534}.media-row{display:flex;gap:12px;align-items:center}.thumb{width:88px;height:62px;object-fit:cover;border-radius:9px;background:#eef2f7}.media-row>div{flex:1}.editor{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.device-tabs{display:flex;gap:7px;margin:12px 0}.device{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-size:10px;font-weight:800;cursor:pointer}.device.active{background:#075ea8;color:#fff}.crop-preview{position:relative;overflow:hidden;background:#e5e7eb;border-radius:14px;margin:12px 0;height:260px}.crop-preview.mobile{width:min(280px,100%);height:360px;margin-left:auto;margin-right:auto}.crop-preview img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center;user-select:none;pointer-events:none}.range-row{display:grid;grid-template-columns:62px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:10px}.range-row input{width:100%}.range-value{text-align:right;color:var(--muted)}.editor-note{font-size:10px;color:var(--muted);line-height:1.7}.empty{font-size:11px;color:#9ca3af;padding:15px 0}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.hero h1{font-size:21px}.crop-preview{height:190px}}</style></head><body><header class="top"><div class="brand">ホームページ管理<small>８LABO PORTAL</small></div><a class="back" href="staff.html">← 管理メニューへ</a></header><main class="wrap"><section class="hero"><h1>公式ホームページを日常的に更新</h1><p>お知らせ・写真・簡単な文章を、GitHubを触らずに更新できます。</p><a class="preview-link" href="https://8labo.github.io/8labo-website/preview/" target="_blank" rel="noopener">現在のHPプレビューを開く ↗</a></section><div id="status" class="status">管理者権限を確認しています…</div><section id="app" class="hidden"><div class="tabs"><button class="tab active" data-tab="news">お知らせ</button><button class="tab" data-tab="media">写真</button><button class="tab" data-tab="content">簡単な文章</button></div><section id="news" class="panel active"><div class="grid"><div class="card"><h2>お知らせを作成・編集</h2><input id="newsId" type="hidden"><div class="field"><label>タイトル</label><input id="newsTitle"></div><div class="row"><div class="field"><label>カテゴリー</label><select id="newsCategory"><option>お知らせ</option><option>イベント</option><option>ACADEMY</option><option>活動報告</option></select></div><div class="field"><label>公開状態</label><select id="newsPublished"><option value="false">下書き</option><option value="true">公開</option></select></div></div><div class="field"><label>本文</label><textarea id="newsBody"></textarea></div><div class="field"><label>リンクURL（任意）</label><input id="newsLink"></div><div class="field"><label>画像URL（任意）</label><input id="newsImage"></div><div class="actions"><button id="saveNews" class="btn blue">保存</button><button id="clearNews" class="btn ghost">新規入力に戻す</button></div></div><div class="card"><h2>登録済みのお知らせ</h2><div id="newsList"></div></div></div></section><section id="media" class="panel"><div class="grid"><div class="card"><h2>写真をアップロード</h2><p class="sub">アップロード後、PCとスマホそれぞれの画角を調整できます。元画像は切り取りません。</p><div class="field"><label>写真</label><input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>表示場所</label><select id="mediaSlot"><option value="home_hero_image">トップページ｜メイン写真</option><option value="home_featured_image">トップページ｜ACADEMY紹介写真</option><option value="home_activity_kids_image">トップページ｜子ども・運動教室</option><option value="home_activity_school_image">トップページ｜園・学校</option><option value="home_activity_sports_image">トップページ｜スポーツ現場</option><option value="home_activity_community_image">トップページ｜地域・企業</option><option value="academy_hero_image">ACADEMY｜メイン写真</option></select></div><button id="uploadMedia" class="btn blue">アップロード</button><div id="cropEditor" class="editor hidden"><h2>画角を調整</h2><p class="editor-note">PCとスマホは別設定です。横位置・縦位置・拡大率を調整してください。</p><div class="device-tabs"><button class="device active" data-device="desktop">PC</button><button class="device" data-device="mobile">スマホ</button></div><div id="cropPreview" class="crop-preview"><img id="cropImage" alt="画角プレビュー"></div><div class="range-row"><b>横位置</b><input id="posX" type="range" min="0" max="100" value="50"><span id="posXVal" class="range-value">50%</span></div><div class="range-row"><b>縦位置</b><input id="posY" type="range" min="0" max="100" value="50"><span id="posYVal" class="range-value">50%</span></div><div class="range-row"><b>拡大</b><input id="zoom" type="range" min="100" max="300" step="5" value="100"><span id="zoomVal" class="range-value">1.00×</span></div><div class="actions"><button id="saveCrop" class="btn blue">この画角で保存</button><button id="resetCrop" class="btn ghost">中央に戻す</button></div></div></div><div class="card"><h2>現在の写真</h2><p class="sub">設定済み写真も「画角調整」から再編集できます。</p><div id="mediaList"></div></div></div></section><section id="content" class="panel"><div class="card"><h2>簡単な文章修正</h2><div id="contentFields"></div><button id="saveContent" class="btn blue">文章を保存</button></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let news=[],contents=[],editKey=null,device='desktop',draft={desktop:{x:50,y:50,z:1},mobile:{x:50,y:50,z:1}};const labels={home_hero_image:'トップページ｜メイン写真',home_featured_image:'トップページ｜ACADEMY紹介写真',home_activity_kids_image:'トップページ｜子ども・運動教室',home_activity_school_image:'トップページ｜園・学校',home_activity_sports_image:'トップページ｜スポーツ現場',home_activity_community_image:'トップページ｜地域・企業',academy_hero_image:'ACADEMY｜メイン写真'};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,ok=true){$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return msg('ログインが必要です。',false);const{data:admin,error}=await sb.rpc('is_system_admin');if(error||!admin)return msg('この画面は全体管理者のみ利用できます。',false);$('app').classList.remove('hidden');msg('ホームページ管理に接続しました。');await loadAll()}async function loadAll(){let r=await sb.from('website_news').select('*').order('published_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false});if(r.error)return msg(r.error.message,false);news=r.data||[];r=await sb.from('website_content').select('*').order('content_key');if(r.error)return msg(r.error.message,false);contents=r.data||[];renderNews();renderMedia();renderContent()}function renderNews(){$('newsList').innerHTML=news.map(n=>`<div class="news-item"><span class="badge ${n.is_published?'live':''}">${n.is_published?'公開中':'下書き'}</span><span class="badge">${esc(n.category)}</span><h3>${esc(n.title)}</h3><div class="actions"><button class="btn ghost" onclick="editNews(${n.id})">編集</button><button class="btn danger" onclick="deleteNews(${n.id})">削除</button></div></div>`).join('')||'<div class="empty">お知らせはまだありません。</div>'}window.editNews=id=>{const n=news.find(x=>x.id===id);if(!n)return;$('newsId').value=n.id;$('newsTitle').value=n.title;$('newsCategory').value=n.category;$('newsPublished').value=String(n.is_published);$('newsBody').value=n.body||'';$('newsLink').value=n.link_url||'';$('newsImage').value=n.image_url||''};window.deleteNews=async id=>{if(!confirm('削除しますか？'))return;const{error}=await sb.from('website_news').delete().eq('id',id);if(error)return msg(error.message,false);loadAll()};function clearNews(){$('newsId').value='';$('newsTitle').value='';$('newsCategory').value='お知らせ';$('newsPublished').value='false';$('newsBody').value='';$('newsLink').value='';$('newsImage').value=''}async function saveNews(){const title=$('newsTitle').value.trim();if(!title)return msg('タイトルを入力してください。',false);const pub=$('newsPublished').value==='true',payload={title,category:$('newsCategory').value,body:$('newsBody').value.trim(),link_url:$('newsLink').value.trim()||null,image_url:$('newsImage').value.trim()||null,is_published:pub,published_at:pub?new Date().toISOString():null,updated_at:new Date().toISOString()},id=$('newsId').value,r=id?await sb.from('website_news').update(payload).eq('id',id):await sb.from('website_news').insert(payload);if(r.error)return msg(r.error.message,false);clearNews();msg('お知らせを保存しました。');loadAll()}function renderMedia(){$('mediaList').innerHTML=Object.entries(labels).map(([k,l])=>{const x=contents.find(v=>v.content_key===k),u=x?.content_value||'';return `<div class="media-item"><div class="media-row">${u?`<img class="thumb" src="${esc(u)}">`:'<div class="thumb"></div>'}<div><b style="font-size:11px">${esc(l)}</b><div class="meta">${u?'設定済み':'未設定'}</div>${u?`<button class="btn ghost" style="margin-top:7px" onclick="openCrop('${k}')">画角調整</button>`:''}</div></div></div>`}).join('')}window.openCrop=k=>{const x=contents.find(v=>v.content_key===k);if(!x?.content_value)return;editKey=k;draft={desktop:{x:x.desktop_position_x??50,y:x.desktop_position_y??50,z:Number(x.desktop_zoom??1)},mobile:{x:x.mobile_position_x??50,y:x.mobile_position_y??50,z:Number(x.mobile_zoom??1)}};$('cropImage').src=x.content_value;$('cropEditor').classList.remove('hidden');setDevice('desktop');$('cropEditor').scrollIntoView({behavior:'smooth',block:'center'})};async function uploadMedia(){const f=$('mediaFile').files[0];if(!f)return msg('写真を選択してください。',false);if(f.size>10*1024*1024)return msg('写真は10MB以下にしてください。',false);const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;let r=await sb.storage.from('website-media').upload(path,f,{contentType:f.type});if(r.error)return msg('アップロード失敗：'+r.error.message,false);const{data:u}=sb.storage.from('website-media').getPublicUrl(path),key=$('mediaSlot').value;r=await sb.from('website_content').update({content_value:u.publicUrl,desktop_position_x:50,desktop_position_y:50,desktop_zoom:1,mobile_position_x:50,mobile_position_y:50,mobile_zoom:1,updated_at:new Date().toISOString()}).eq('content_key',key);if(r.error)return msg(r.error.message,false);$('mediaFile').value='';await loadAll();openCrop(key);msg('アップロードしました。PC・スマホの画角を調整して保存してください。')}function setDevice(d){device=d;document.querySelectorAll('.device').forEach(b=>b.classList.toggle('active',b.dataset.device===d));$('cropPreview').classList.toggle('mobile',d==='mobile');const v=draft[d];$('posX').value=v.x;$('posY').value=v.y;$('zoom').value=Math.round(v.z*100);updatePreview()}function updateDraft(){draft[device]={x:Number($('posX').value),y:Number($('posY').value),z:Number($('zoom').value)/100};updatePreview()}function updatePreview(){const v=draft[device];$('posXVal').textContent=v.x+'%';$('posYVal').textContent=v.y+'%';$('zoomVal').textContent=v.z.toFixed(2)+'×';$('cropImage').style.objectPosition=`${v.x}% ${v.y}%`;$('cropImage').style.transform=`scale(${v.z})`}async function saveCrop(){if(!editKey)return;const p={desktop_position_x:draft.desktop.x,desktop_position_y:draft.desktop.y,desktop_zoom:draft.desktop.z,mobile_position_x:draft.mobile.x,mobile_position_y:draft.mobile.y,mobile_zoom:draft.mobile.z,updated_at:new Date().toISOString()};const{error}=await sb.from('website_content').update(p).eq('content_key',editKey);if(error)return msg(error.message,false);msg('PC・スマホの画角を保存しました。');loadAll()}function renderContent(){const a=contents.filter(x=>x.content_type!=='image');$('contentFields').innerHTML=a.map(x=>`<div class="field"><label>${esc(x.label)}</label>${x.content_type==='textarea'?`<textarea data-content-key="${esc(x.content_key)}">${esc(x.content_value)}</textarea>`:`<input data-content-key="${esc(x.content_key)}" value="${esc(x.content_value)}">`}</div>`).join('')}async function saveContent(){for(const el of document.querySelectorAll('[data-content-key]')){const{error}=await sb.from('website_content').update({content_value:el.value,updated_at:new Date().toISOString()}).eq('content_key',el.dataset.contentKey);if(error)return msg(error.message,false)}msg('文章を保存しました。');loadAll()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});document.querySelectorAll('.device').forEach(b=>b.onclick=()=>setDevice(b.dataset.device));['posX','posY','zoom'].forEach(id=>$(id).oninput=updateDraft);$('resetCrop').onclick=()=>{draft[device]={x:50,y:50,z:1};setDevice(device)};$('saveCrop').onclick=saveCrop;$('uploadMedia').onclick=uploadMedia;$('saveNews').onclick=saveNews;$('clearNews').onclick=clearNews;$('saveContent').onclick=saveContent;boot();</script></body></html>
