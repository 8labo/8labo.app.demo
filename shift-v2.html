<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO シフト管理</title><style>body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}*{box-sizing:border-box}header{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1100px)/2))}a{color:#6b7280;text-decoration:none;font-size:11px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:22px 0 70px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.btn{border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.tabs button.on,.btn.primary{background:#111827;color:#fff}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:17px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 4px}.sub,.meta{font-size:10px;color:#6b7280;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:12px}.stat b{font-size:21px;display:block}.stat span{font-size:9px;color:#6b7280}.shift{border-top:1px solid #eef1f4;padding:12px 0}.shift:first-child{border-top:0}.head{display:flex;justify-content:space-between;gap:8px}.head h3{font-size:13px;margin:0}.badge{font-size:8px;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f7}.response{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.response button{border:1px solid #d9dfe7;background:#fff;border-radius:9px;padding:7px 9px;font-size:9px;font-weight:800}.response button.sel{background:#111827;color:#fff}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:end}.field{margin:7px 0}.field label{display:block;font-size:9px;font-weight:800;color:#64748b;margin-bottom:4px}.field input,.field select{border:1px solid #d7dde5;border-radius:9px;padding:8px;background:#fff}.toolbar .field{min-width:130px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #eef1f4}.role{min-width:120px}.hidden{display:none!important}.manager{display:none}.manager.show{display:block}.empty{color:#9ca3af;font-size:11px;padding:10px 0}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header><b>８LABO シフト管理</b><a href="staff.html">← 管理一覧に戻る</a></header><main class="wrap"><div class="summary"><div class="stat"><b id="nAnswer">0</b><span>回答が必要</span></div><div class="stat"><b id="nOpen">0</b><span>調整中</span></div><div class="stat"><b id="nMine">0</b><span>自分の確定</span></div><div class="stat"><b id="nChange">0</b><span>変更・交代</span></div></div><div class="tabs"><button class="on" data-tab="answer">回答する</button><button data-tab="confirmed">確定シフト</button><button data-tab="change">変更・交代</button><button id="managerTab" class="manager" data-tab="manage">調整・配置</button></div><section id="answer" class="panel on"><div class="card"><h2>シフト調査</h2><p class="sub">公開中のシフトをまとめて回答します。確定前までは回答を変更できます。</p><div id="answerList"></div></div></section><section id="confirmed" class="panel"><div class="card"><h2>確定シフト</h2><p class="sub">全スタッフの担当と役割を共有します。</p><div id="confirmedList"></div></div></section><section id="change" class="panel"><div class="grid2"><div class="card"><h2>自分のシフト変更</h2><div id="myChanges"></div></div><div class="card"><h2>届いている交代依頼</h2><div id="incoming"></div></div></div></section><section id="manage" class="panel"><div class="card"><h2>スケジュールからシフト枠を作る</h2><div class="toolbar"><div class="field"><label>対象月</label><input id="month" type="month"></div><div class="field"><label>集合 前</label><input id="before" type="number" value="20" min="0"></div><div class="field"><label>解散 後</label><input id="after" type="number" value="10" min="0"></div><div class="field"><label>必要人数</label><input id="count" type="number" value="2" min="1"></div><button id="loadSchedule" class="btn">予定を読み込む</button><button id="makeSlots" class="btn primary">選択をシフト枠にする</button></div><div id="scheduleList"></div></div><div class="card"><h2>月次シフト調査を公開</h2><div class="toolbar"><div class="field"><label>回答期限</label><input id="deadline" type="datetime-local"></div><button id="publish" class="btn primary">対象月の調査を開始</button></div><div id="draftList"></div></div><div class="card"><h2>配置・役割を決める</h2><div class="field"><select id="slotSelect"></select></div><div id="staffList"></div><button id="confirm" class="btn primary">この配置で確定</button></div><div class="card"><h2>交代申請の最終確認</h2><div id="managerChanges"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);let me,isManager=false,slots=[],responses=[],assignments=[],staff=[],people=[],schedule=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),tm=s=>s?s.slice(0,5):'—',today=()=>new Date().toISOString().slice(0,10);function add(t,n){if(!t)return null;let[a,b]=t.slice(0,5).split(':').map(Number),m=(a*60+b+n+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function p(stid){let st=staff.find(x=>x.id===stid),x=people.find(y=>y.id===st?.person_id);return x?x.last_name+' '+x.first_name:'スタッフ'}function ex(a){try{let x=JSON.parse(a.notes||'');return x.kind==='exchange'?x:null}catch{return null}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab))});async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return;let{data:sid}=await sb.rpc('current_staff_id');if(!sid)return;me=sid;let{data:sys}=await sb.rpc('is_system_admin');isManager=!!sys;if(!isManager){let{data:ss}=await sb.from('services').select('id');for(let s of ss||[]){let{data:ok}=await sb.rpc('can_manage_shifts',{target_service_id:s.id});if(ok){isManager=true;break}}}if(isManager)$('managerTab').classList.add('show');let n=new Date();n.setMonth(n.getMonth()+1);$('month').value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;await load()}async function load(){let r=await sb.from('staff_shift_slots').select('*').gte('shift_date',today()).order('shift_date');slots=r.data||[];r=await sb.from('staff_shift_responses').select('*');responses=r.data||[];r=await sb.from('staff_shift_assignments').select('*');assignments=r.data||[];r=await sb.from('staff_users').select('id,person_id').eq('staff_status','active');staff=r.data||[];r=await sb.from('persons').select('id,last_name,first_name');people=r.data||[];render()}function render(){let open=slots.filter(s=>s.status==='open'),mine=assignments.filter(a=>a.staff_user_id===me&&a.assignment_status!=='cancelled'&&slots.find(s=>s.id===a.shift_slot_id)?.status==='confirmed');$('nAnswer').textContent=open.filter(s=>!responses.find(r=>r.shift_slot_id===s.id&&r.staff_user_id===me)).length;$('nOpen').textContent=open.length;$('nMine').textContent=mine.length;$('nChange').textContent=assignments.filter(a=>{let x=ex(a);return x&&['pending_target','target_approved'].includes(x.status)&&(a.staff_user_id===me||x.target===me)}).length;renderAnswer(open);renderConfirmed();renderChange(mine);if(isManager){renderDraft();renderAssign();renderManager()}}function renderAnswer(open){$('answerList').innerHTML=open.map(s=>{let r=responses.find(x=>x.shift_slot_id===s.id&&x.staff_user_id===me);return `<div class="shift"><div class="head"><div><h3>${esc(s.title)}</h3><div class="meta">${s.shift_date}｜${tm(s.start_time)}〜${tm(s.end_time)}｜必要${s.required_count}名</div></div><span class="badge">回答受付中</span></div><div class="response">${[['preferred','できれば入りたい'],['available','勤務可能'],['unavailable','勤務不可']].map(([v,l])=>`<button data-r="${v}" data-s="${s.id}" class="${r?.response_status===v?'sel':''}">${l}</button>`).join('')}</div></div>`}).join('')||'<div class="empty">回答が必要なシフトはありません。</div>';document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>saveResponse(b.dataset.s,b.dataset.r))}async function saveResponse(s,v){let r=responses.find(x=>x.shift_slot_id===s&&x.staff_user_id===me),q=r?sb.from('staff_shift_responses').update({response_status:v,updated_at:new Date().toISOString()}).eq('id',r.id):sb.from('staff_shift_responses').insert({shift_slot_id:s,staff_user_id:me,response_status:v});let{error}=await q;if(error)return alert(error.message);load()}function renderConfirmed(){$('confirmedList').innerHTML=slots.filter(s=>s.status==='confirmed').map(s=>{let aa=assignments.filter(a=>a.shift_slot_id===s.id&&a.assignment_status!=='cancelled');return `<div class="shift"><h3>${esc(s.title)}</h3><div class="meta">${s.shift_date}｜${tm(s.start_time)}〜${tm(s.end_time)}</div><div class="meta">${aa.map(a=>`<b>${esc(a.role_name||'担当')}</b>：${esc(p(a.staff_user_id))}${a.staff_user_id===me?'（あなた）':''}`).join('<br>')||'配置なし'}</div></div>`}).join('')||'<div class="empty">確定シフトはありません。</div>'}function renderChange(mine){$('myChanges').innerHTML=mine.map(a=>{let s=slots.find(x=>x.id===a.shift_slot_id),x=ex(a);return `<div class="shift"><h3>${esc(s.title)}</h3><div class="meta">${s.shift_date}｜${esc(a.role_name||'担当')}</div>${x?`<div class="meta">交代申請中：${esc(p(x.target))}</div>`:`<div class="toolbar"><select data-t="${a.id}">${staff.filter(st=>st.id!==me).map(st=>`<option value="${st.id}">${esc(p(st.id))}</option>`).join('')}</select><input data-reason="${a.id}" placeholder="理由"><button class="btn" data-req="${a.id}">交代依頼</button></div>`}</div>`}).join('')||'<div class="empty">変更対象はありません。</div>';document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>request(b.dataset.req));let inc=assignments.filter(a=>ex(a)?.target===me&&ex(a)?.status==='pending_target');$('incoming').innerHTML=inc.map(a=>{let x=ex(a),s=slots.find(z=>z.id===a.shift_slot_id);return `<div class="shift"><h3>${esc(s?.title)}</h3><div class="meta">${esc(p(a.staff_user_id))} → あなた｜${esc(a.role_name||'担当')}<br>${esc(x.reason||'')}</div><div class="response"><button data-ok="${a.id}">承認</button><button data-ng="${a.id}">却下</button></div></div>`}).join('')||'<div class="empty">交代依頼はありません。</div>';document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,true));document.querySelectorAll('[data-ng]').forEach(b=>b.onclick=()=>decide(b.dataset.ng,false))}async function request(id){let a=assignments.find(x=>x.id===id),target=document.querySelector(`[data-t="${id}"]`).value,reason=document.querySelector(`[data-reason="${id}"]`).value;await sb.from('staff_shift_assignments').update({notes:JSON.stringify({kind:'exchange',target,status:'pending_target',reason}),updated_at:new Date().toISOString()}).eq('id',id).eq('staff_user_id',me);load()}async function decide(id,ok){let a=assignments.find(x=>x.id===id),x=ex(a);await sb.from('staff_shift_assignments').update({notes:JSON.stringify({...x,status:ok?'target_approved':'target_rejected'}),updated_at:new Date().toISOString()}).eq('id',id);load()}async function loadSchedule(){let ym=$('month').value,from=ym+'-01',d=new Date(+ym.slice(0,4),+ym.slice(5,7),0),to=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,r=await sb.rpc('get_staff_unified_schedule',{p_from:from,p_to:to});if(r.error)return alert(r.error.message);schedule=r.data||[];let existing=new Set(slots.map(s=>s.source_type+'|'+s.source_event_id));$('scheduleList').innerHTML=schedule.map(e=>{let k=e.source_type+'|'+e.source_event_id,done=existing.has(k);return `<label class="row"><input type="checkbox" data-sch="${k}" ${done?'disabled':''}><div><b>${e.event_date}｜${esc(e.title)}</b><div class="meta">${tm(e.start_time)}〜${tm(e.end_time)}</div></div><span class="badge">${done?'作成済':'未設定'}</span></label>`}).join('')||'<div class="empty">予定なし</div>'}async function makeSlots(){let keys=[...document.querySelectorAll('[data-sch]:checked')].map(x=>x.dataset.sch);if(!keys.length)return alert('予定を選択してください。');for(let k of keys){let e=schedule.find(x=>x.source_type+'|'+x.source_event_id===k),before=+$('before').value||0,after=+$('after').value||0;let row={service_id:e.service_id||null,title:e.title,shift_date:e.event_date,start_time:add(e.start_time,-before),end_time:add(e.end_time,after),participant_start_time:e.start_time||null,participant_end_time:e.end_time||null,location:e.location||e.venue||null,required_count:+$('count').value||1,status:'draft',source_type:e.source_type,source_event_id:e.source_event_id,before_minutes:before,after_minutes:after,created_by:me};let r=await sb.from('staff_shift_slots').insert(row);if(r.error&&!r.error.message.includes('duplicate'))return alert(r.error.message)}await load();await loadSchedule()}function monthSlots(){return slots.filter(s=>s.shift_date.startsWith($('month').value))}function renderDraft(){$('draftList').innerHTML=monthSlots().filter(s=>['draft','open'].includes(s.status)).map(s=>`<div class="shift"><b>${esc(s.title)}</b><div class="meta">${s.shift_date}｜${s.status==='open'?'公開中':'未公開'}</div></div>`).join('')||'<div class="empty">対象月のシフト枠はありません。</div>'}async function publish(){let list=monthSlots().filter(s=>s.status==='draft');if(!list.length)return alert('未公開シフトがありません。');for(let s of list)await sb.from('staff_shift_slots').update({status:'open',notes:`回答期限:${$('deadline').value||''}`,updated_at:new Date().toISOString()}).eq('id',s.id);load()}function renderAssign(){let list=slots.filter(s=>s.status==='open');$('slotSelect').innerHTML=list.map(s=>`<option value="${s.id}">${s.shift_date}｜${esc(s.title)}</option>`).join('');renderStaff()}function renderStaff(){let id=$('slotSelect').value,rs=responses.filter(r=>r.shift_slot_id===id);$('staffList').innerHTML=staff.map(st=>{let r=rs.find(x=>x.staff_user_id===st.id);return `<div class="row"><label><input type="checkbox" data-as="${st.id}"> ${esc(p(st.id))}<div class="meta">${r?.response_status||'未回答'}</div></label><select class="role" data-role="${st.id}"><option>メイン担当</option><option selected>サポート担当</option><option>受付</option><option>測定担当</option><option>撮影・広報</option></select><span></span></div>`}).join('')}$('slotSelect').onchange=renderStaff;async function confirmShift(){let slot=$('slotSelect').value,chosen=[...document.querySelectorAll('[data-as]:checked')];if(!slot||!chosen.length)return alert('スタッフを選択してください。');for(let a of assignments.filter(x=>x.shift_slot_id===slot&&x.assignment_status!=='cancelled'))await sb.from('staff_shift_assignments').update({assignment_status:'cancelled'}).eq('id',a.id);for(let c of chosen){let role=document.querySelector(`[data-role="${c.dataset.as}"]`).value;await sb.from('staff_shift_assignments').insert({shift_slot_id:slot,staff_user_id:c.dataset.as,assignment_status:'assigned',assigned_by:me,role_name:role})}await sb.from('staff_shift_slots').update({status:'confirmed'}).eq('id',slot);load()}function renderManager(){let list=assignments.filter(a=>ex(a)?.status==='target_approved');$('managerChanges').innerHTML=list.map(a=>{let x=ex(a),s=slots.find(z=>z.id===a.shift_slot_id);return `<div class="shift"><b>${esc(s?.title)}</b><div class="meta">${esc(p(a.staff_user_id))} → ${esc(p(x.target))}｜${esc(a.role_name||'担当')}</div><button class="btn primary" data-final="${a.id}">正式変更</button></div>`}).join('')||'<div class="empty">確認待ちはありません。</div>';document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>finalize(b.dataset.final))}async function finalize(id){let a=assignments.find(x=>x.id===id),x=ex(a);await sb.from('staff_shift_assignments').update({assignment_status:'cancelled',notes:JSON.stringify({...x,status:'completed'})}).eq('id',id);await sb.from('staff_shift_assignments').insert({shift_slot_id:a.shift_slot_id,staff_user_id:x.target,assignment_status:'assigned',assigned_by:me,role_name:a.role_name||'サポート担当'});load()}$('loadSchedule').onclick=loadSchedule;$('makeSlots').onclick=makeSlots;$('publish').onclick=publish;$('month').onchange=()=>{renderDraft();loadSchedule()};$('confirm').onclick=confirmShift;boot();</script></body></html>
