<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO インポート</title><style>body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}*{box-sizing:border-box}header{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 980px)/2))}a{color:#6b7280;text-decoration:none;font-size:11px}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;margin-bottom:14px}.card h1,.card h2{margin:0 0 7px}.sub{font-size:11px;color:#6b7280;line-height:1.7}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 13px;font-size:11px;font-weight:900;background:#111827;color:#fff;cursor:pointer;text-decoration:none}.btn.light{background:#f3f4f6;color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input[type=file]{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}.preview{overflow:auto;margin-top:14px;border:1px solid #e5e7eb;border-radius:12px}.preview table{border-collapse:collapse;width:100%;font-size:10px;white-space:nowrap}.preview th,.preview td{padding:8px;border-bottom:1px solid #eef1f4;text-align:left;vertical-align:top}.preview th{background:#f8fafc;position:sticky;top:0}.status{font-size:11px;padding:11px 13px;border-radius:11px;background:#f8fafc}.warn{background:#fff7ed;color:#9a3412}.ok{background:#f0fdf4;color:#166534}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{padding:11px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#6b7280}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#eef2f7}.pill.new{background:#eff6ff;color:#1d4ed8}.pill.update{background:#fff7ed;color:#9a3412}.pill.same{background:#f0fdf4;color:#166534}.pill.review{background:#fef2f2;color:#991b1b}.diff{font-size:9px;line-height:1.6;color:#6b7280;max-width:360px;white-space:normal}.diff b{color:#111827}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}}</style></head><body><header><b>８LABO インポート</b><a id="back" href="staff.html">← 戻る</a></header><main class="wrap"><section class="card"><h1 id="title">データインポート</h1><p id="desc" class="sub"></p><div class="actions"><button id="template" class="btn light">インポート用フォーマットをダウンロード</button><a class="btn light" href="data-export.html">データ管理センター</a></div></section><section class="card"><h2>CSVを読み込む</h2><p class="sub">最初にプレビューし、内容を確認してから登録・更新します。日本語の列名でも、括弧内の内部項目名でも読み込めます。人物データは８LABO IDがあればそのIDを最優先で照合します。</p><input id="file" type="file" accept=".csv,text/csv"><div class="actions"><button id="previewBtn" class="btn light">内容を確認</button><button id="importBtn" class="btn" disabled>登録・更新を実行</button></div><div id="status" class="status">CSVを選択してください。</div><div id="summary" class="summary hidden"></div><div id="preview" class="preview hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);const type=new URLSearchParams(location.search).get('type')||'persons';let rows=[],plans=[];const defs={persons:{title:'人物データのインポート',desc:'人物データを安全に新規登録・更新します。８LABO IDがある行は既存人物を更新し、空欄は既存値を消しません。',back:'portal-admin.html',cols:[['８LABO ID','labo_id'],['姓','last_name'],['名','first_name'],['姓カナ','last_name_kana'],['名カナ','first_name_kana'],['生年月日','birth_date'],['性別','gender'],['電話番号','phone'],['メールアドレス','email'],['状態','status'],['備考','notes']],required:['last_name','first_name']},activities:{title:'活動データのインポート',desc:'チーム指導・園学校・企業団体・測定会などの活動予定を登録します。',back:'activity-admin.html',cols:[['活動名','title'],['活動区分','activity_type'],['実施先','client_name'],['日付','activity_date'],['開始時刻','start_time'],['終了時刻','end_time'],['会場','venue'],['住所','venue_address'],['必要スタッフ数','required_staff'],['公開範囲','visibility'],['備考','notes']],required:['title','activity_date']},shifts:{title:'シフト枠のインポート',desc:'シフト枠を一括登録します。通常はスケジュールから作成する運用を推奨します。',back:'shift-v2.html',cols:[['タイトル','title'],['日付','shift_date'],['開始時刻','start_time'],['終了時刻','end_time'],['場所','location'],['必要人数','required_count'],['状態','status'],['備考','notes']],required:['title','shift_date']}};const def=defs[type]||defs.persons;$('title').textContent=def.title;$('desc').textContent=def.desc;$('back').href=def.back;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function norm(k){let raw=String(k??'').replace(/^\ufeff/,'').trim(),normalized=raw.normalize('NFKC').trim(),m=normalized.match(/\(([^)]+)\)/);if(m)return m[1].trim();for(const [jp,en] of def.cols){if(normalized===jp.normalize('NFKC')||normalized===en)return en}return normalized}function clean(v){return String(v??'').trim()}function downloadTemplate(){let heads=def.cols.map(([jp,en])=>`${jp}（${en}）`);let ex={persons:['','山田','太郎','ヤマダ','タロウ','2015-04-01','男性','09012345678','sample@example.jp','利用中',''],activities:['○○チーム指導','出張・チーム指導','○○スポーツ少年団','2026-09-10','18:00','19:30','○○体育館','松山市○○','2','スタッフのみ',''],shifts:['石井教室','2026-09-08','16:30','18:10','石井公民館','2','下書き','']}[type]||[];let text='\ufeff'+heads.join(',')+'\n'+ex.map(csvCell).join(',')+'\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`8labo_${type}_import_template.csv`;a.click();URL.revokeObjectURL(a.href)}function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}$('template').onclick=downloadTemplate;async function verify(){let{data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='ログインが必要です。';$('importBtn').disabled=true;return false}let{data:ok}=await sb.rpc('is_system_admin');if(!ok){$('status').textContent='全体管理者のみインポートできます。';$('importBtn').disabled=true;return false}return true}function mapStatus(v,kind){let s=clean(v);const maps={person:{'利用中':'active','有効':'active','停止中':'inactive','停止':'inactive','保管済み':'archived'},activity:{'スタッフのみ':'staff','一般公開':'public','対象者のみ':'targeted'},shift:{'下書き':'draft','回答受付中':'open','調整中':'open','確定':'confirmed','中止':'cancelled'}};return maps[kind]?.[s]||s||null}function normDate(v){return clean(v).slice(0,10)}function sameText(a,b){return clean(a)===clean(b)}function personInput(r){return{labo_id:clean(r.labo_id),last_name:clean(r.last_name),first_name:clean(r.first_name),last_name_kana:clean(r.last_name_kana),first_name_kana:clean(r.first_name_kana),birth_date:normDate(r.birth_date),gender:clean(r.gender),phone:clean(r.phone),email:clean(r.email).toLowerCase(),status:mapStatus(r.status,'person')||'',notes:clean(r.notes)}}function personDiff(existing,input){const fields=[['姓','last_name'],['名','first_name'],['姓カナ','last_name_kana'],['名カナ','first_name_kana'],['生年月日','birth_date'],['性別','gender'],['電話番号','phone'],['メールアドレス','email'],['状態','status'],['備考','notes']],changes=[];for(const [label,key] of fields){const nv=clean(input[key]);if(!nv)continue;const ov=key==='birth_date'?normDate(existing[key]):key==='email'?clean(existing[key]).toLowerCase():clean(existing[key]);if(nv!==ov)changes.push({label,key,old:ov,new:nv})}return changes}async function buildPersonPlans(){const{data:existing,error}=await sb.from('persons').select('id,labo_id,last_name,first_name,last_name_kana,first_name_kana,birth_date,gender,phone,email,status,notes');if(error)throw error;plans=rows.map((raw,index)=>{const input=personInput(raw),idnum=input.labo_id?Number(input.labo_id):null;let matches=[],matchReason='';if(idnum&&Number.isInteger(idnum)){matches=existing.filter(p=>Number(p.labo_id)===idnum);matchReason='８LABO ID'}else if(input.birth_date){matches=existing.filter(p=>sameText(p.last_name,input.last_name)&&sameText(p.first_name,input.first_name)&&normDate(p.birth_date)===input.birth_date);matchReason='氏名＋生年月日'}else if(input.email){matches=existing.filter(p=>clean(p.email).toLowerCase()===input.email&&sameText(p.last_name,input.last_name)&&sameText(p.first_name,input.first_name));matchReason='氏名＋メール'}else{matches=existing.filter(p=>sameText(p.last_name,input.last_name)&&sameText(p.first_name,input.first_name));matchReason='氏名'}if(matches.length>1)return{index,input,kind:'review',reason:`${matchReason}で複数候補があります`,matches};if(matches.length===1){const target=matches[0],changes=personDiff(target,input);return{index,input,kind:changes.length?'update':'same',target,changes,reason:matchReason}}if(idnum)return{index,input,kind:'review',reason:`８LABO ID ${idnum} は現在登録されていません。新規作成は自動採番で行うため要確認です`,matches:[]};const sameNames=existing.filter(p=>sameText(p.last_name,input.last_name)&&sameText(p.first_name,input.first_name));if(sameNames.length)return{index,input,kind:'review',reason:'同姓同名の既存人物があります。８LABO IDまたは生年月日を入れて再確認してください',matches:sameNames};return{index,input,kind:'new',reason:'既存人物に一致なし'}})}function renderPersonPlans(){const c={new:0,update:0,same:0,review:0};plans.forEach(p=>c[p.kind]++);$('summary').innerHTML=`<div class="stat"><b>${c.new}</b><span>新規登録</span></div><div class="stat"><b>${c.update}</b><span>更新</span></div><div class="stat"><b>${c.same}</b><span>変更なし</span></div><div class="stat"><b>${c.review}</b><span>要確認</span></div>`;$('summary').classList.remove('hidden');const label={new:'新規',update:'更新',same:'変更なし',review:'要確認'},cls={new:'new',update:'update',same:'same',review:'review'};$('preview').innerHTML='<table><thead><tr><th>行</th><th>判定</th><th>８LABO ID</th><th>氏名</th><th>変更内容・理由</th></tr></thead><tbody>'+plans.map(p=>{let detail='';if(p.kind==='update')detail=p.changes.map(d=>`<div><b>${esc(d.label)}</b>：${esc(d.old||'（空欄）')} → ${esc(d.new)}</div>`).join('');else detail=esc(p.reason||'');const id=p.target?.labo_id||p.input.labo_id||'';return `<tr><td>${p.index+2}</td><td><span class="pill ${cls[p.kind]}">${label[p.kind]}</span></td><td>${esc(id)}</td><td>${esc(p.input.last_name+' '+p.input.first_name)}</td><td class="diff">${detail}</td></tr>`}).join('')+'</tbody></table>';$('preview').classList.remove('hidden');const bad=c.review>0;$('importBtn').disabled=bad||(!c.new&&!c.update);$('status').textContent=bad?`要確認が${c.review}件あります。安全のためこのままでは実行できません。該当行に８LABO IDや生年月日を追加して再確認してください。`:`新規${c.new}件、更新${c.update}件、変更なし${c.same}件です。内容を確認してから実行してください。`;$('status').className='status '+(bad?'warn':'ok')}function genericShow(){if(!rows.length)return;let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];$('preview').innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,30).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';$('preview').classList.remove('hidden')}$('previewBtn').onclick=()=>{let f=$('file').files[0];if(!f)return alert('CSVを選択してください。');Papa.parse(f,{header:true,skipEmptyLines:true,complete:async r=>{rows=(r.data||[]).map(x=>Object.fromEntries(Object.entries(x).map(([k,v])=>[norm(k),v])));const missing=def.required.filter(req=>!rows.length||rows.some(row=>!clean(row[req])));if(missing.length){const labels=missing.map(req=>def.cols.find(([,en])=>en===req)?.[0]||req);$('status').textContent=`必須項目が空の行があります：${labels.join('、')}。`;$('status').className='status warn';$('importBtn').disabled=true;return}try{if(type==='persons'){if(!await verify())return;await buildPersonPlans();renderPersonPlans()}else{$('status').textContent=`${rows.length}件を読み込みました。内容を確認してください。`;$('status').className='status ok';$('importBtn').disabled=!rows.length;genericShow()}}catch(e){$('status').textContent='確認に失敗しました：'+(e.message||e);$('status').className='status warn';$('importBtn').disabled=true}}})};async function executePersonPlans(){const btn=$('importBtn');btn.disabled=true;btn.textContent='処理中…';let created=0,updated=0;try{for(const p of plans){if(p.kind==='same')continue;if(p.kind==='review')throw new Error('要確認の行が残っています。');if(p.kind==='update'){const patch={};for(const d of p.changes)patch[d.key]=d.new;if(Object.keys(patch).length){patch.updated_at=new Date().toISOString();const{error}=await sb.from('persons').update(patch).eq('id',p.target.id);if(error)throw error;updated++}}else if(p.kind==='new'){const i=p.input;const{data,error}=await sb.rpc('admin_create_person_auto',{p_last_name:i.last_name,p_first_name:i.first_name,p_birth_date:i.birth_date||null,p_email:i.email||null,p_phone:i.phone||null,p_notes:i.notes||null});if(error)throw error;const extra={};if(i.last_name_kana)extra.last_name_kana=i.last_name_kana;if(i.first_name_kana)extra.first_name_kana=i.first_name_kana;if(i.gender)extra.gender=i.gender;if(i.status)extra.status=i.status;if(Object.keys(extra).length){const{error:e2}=await sb.from('persons').update(extra).eq('id',data.person_id);if(e2)throw e2}created++}}$('status').textContent=`完了しました。新規${created}件、更新${updated}件です。`;$('status').className='status ok';btn.textContent='完了';rows=[];plans=[]}catch(e){$('status').textContent='処理中にエラーが発生しました：'+(e.message||e);$('status').className='status warn';btn.disabled=false;btn.textContent='登録・更新を実行'}}$('importBtn').onclick=async()=>{if(!await verify())return;if(!rows.length)return;if(type==='persons'){if(!confirm('プレビュー内容どおりに新規登録・更新します。空欄は既存データを削除しません。よろしいですか？'))return;return executePersonPlans()}for(const req of def.required)if(rows.some(r=>!clean(r[req]))){const jp=def.cols.find(([,en])=>en===req)?.[0]||req;return alert(`必須項目「${jp}」が空の行があります。`)}let payload=[];if(type==='activities')payload=rows.map(r=>({title:r.title,activity_type:r.activity_type||'other',client_name:r.client_name||null,activity_date:r.activity_date,start_time:r.start_time||null,end_time:r.end_time||null,venue:r.venue||null,venue_address:r.venue_address||null,required_staff:+r.required_staff||1,visibility:mapStatus(r.visibility,'activity')||'staff',notes:r.notes||null,status:'scheduled'}));if(type==='shifts')payload=rows.map(r=>({title:r.title,shift_date:r.shift_date,start_time:r.start_time||null,end_time:r.end_time||null,location:r.location||null,required_count:+r.required_count||1,status:mapStatus(r.status,'shift')||'draft',notes:r.notes||null}));const table={activities:'labo_activities',shifts:'staff_shift_slots'}[type];const{error}=await sb.from(table).insert(payload);if(error){$('status').textContent='登録できませんでした：'+error.message;$('status').className='status warn';return}$('status').textContent=`${payload.length}件を登録しました。`;$('status').className='status ok';$('importBtn').disabled=true};verify();</script></body></html>
