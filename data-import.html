<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO インポート</title><style>body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}*{box-sizing:border-box}header{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 900px)/2))}a{color:#6b7280;text-decoration:none;font-size:11px}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;margin-bottom:14px}.card h1,.card h2{margin:0 0 7px}.sub{font-size:11px;color:#6b7280;line-height:1.7}.btn{display:inline-block;border:0;border-radius:10px;padding:10px 13px;font-size:11px;font-weight:900;background:#111827;color:#fff;cursor:pointer;text-decoration:none}.btn.light{background:#f3f4f6;color:#111827}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input[type=file]{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}.preview{overflow:auto;margin-top:14px;border:1px solid #e5e7eb;border-radius:12px}.preview table{border-collapse:collapse;width:100%;font-size:10px;white-space:nowrap}.preview th,.preview td{padding:8px;border-bottom:1px solid #eef1f4;text-align:left}.preview th{background:#f8fafc}.status{font-size:11px;padding:11px 13px;border-radius:11px;background:#f8fafc}.warn{background:#fff7ed;color:#9a3412}.ok{background:#f0fdf4;color:#166534}.hidden{display:none!important}</style></head><body><header><b>８LABO インポート</b><a id="back" href="staff.html">← 戻る</a></header><main class="wrap"><section class="card"><h1 id="title">データインポート</h1><p id="desc" class="sub"></p><div class="actions"><button id="template" class="btn light">インポート用フォーマットをダウンロード</button><a class="btn light" href="data-export.html">データ管理センター</a></div></section><section class="card"><h2>CSVを読み込む</h2><p class="sub">最初にプレビューし、内容を確認してから登録します。日本語の列名でも、括弧内の内部項目名でも読み込めます。</p><input id="file" type="file" accept=".csv,text/csv"><div class="actions"><button id="previewBtn" class="btn light">内容を確認</button><button id="importBtn" class="btn" disabled>登録する</button></div><div id="status" class="status">CSVを選択してください。</div><div id="preview" class="preview hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);const type=new URLSearchParams(location.search).get('type')||'persons';let rows=[];const defs={persons:{title:'人物データのインポート',desc:'人物・８LABO IDの元データを登録します。既存人物との重複に注意してください。',back:'portal-admin.html',cols:[['姓','last_name'],['名','first_name'],['姓カナ','last_name_kana'],['名カナ','first_name_kana'],['生年月日','birth_date'],['性別','gender'],['電話番号','phone'],['メールアドレス','email'],['状態','status'],['備考','notes']],required:['last_name','first_name']},activities:{title:'活動データのインポート',desc:'チーム指導・園学校・企業団体・測定会などの活動予定を登録します。',back:'activity-admin.html',cols:[['活動名','title'],['活動区分','activity_type'],['実施先','client_name'],['日付','activity_date'],['開始時刻','start_time'],['終了時刻','end_time'],['会場','venue'],['住所','venue_address'],['必要スタッフ数','required_staff'],['公開範囲','visibility'],['備考','notes']],required:['title','activity_date']},shifts:{title:'シフト枠のインポート',desc:'シフト枠を一括登録します。通常はスケジュールから作成する運用を推奨します。',back:'shift-v2.html',cols:[['タイトル','title'],['日付','shift_date'],['開始時刻','start_time'],['終了時刻','end_time'],['場所','location'],['必要人数','required_count'],['状態','status'],['備考','notes']],required:['title','shift_date']}};const def=defs[type]||defs.persons;$('title').textContent=def.title;$('desc').textContent=def.desc;$('back').href=def.back;function norm(k){let m=k.match(/\(([^)]+)\)/);if(m)return m[1];for(const [jp,en] of def.cols)if(k.trim()===jp||k.trim()===en)return en;return k.trim()}function downloadTemplate(){let heads=def.cols.map(([jp,en])=>`${jp}（${en}）`);let ex={persons:['山田','太郎','ヤマダ','タロウ','2015-04-01','男性','09012345678','sample@example.jp','利用中',''],activities:['○○チーム指導','出張・チーム指導','○○スポーツ少年団','2026-09-10','18:00','19:30','○○体育館','松山市○○','2','スタッフのみ',''],shifts:['石井教室','2026-09-08','16:30','18:10','石井公民館','2','下書き','']}[type]||[];let text='\ufeff'+heads.join(',')+'\n'+ex.join(',')+'\n';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`8labo_${type}_import_template.csv`;a.click();URL.revokeObjectURL(a.href)}$('template').onclick=downloadTemplate;$('previewBtn').onclick=()=>{let f=$('file').files[0];if(!f)return alert('CSVを選択してください。');Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{rows=(r.data||[]).map(x=>Object.fromEntries(Object.entries(x).map(([k,v])=>[norm(k),v])));$('status').textContent=`${rows.length}件を読み込みました。内容を確認してください。`;$('status').className='status ok';$('importBtn').disabled=!rows.length;show()}})};function show(){if(!rows.length)return;let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];$('preview').innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,30).map(r=>'<tr>'+keys.map(k=>'<td>'+String(r[k]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';$('preview').classList.remove('hidden')}function mapStatus(v,kind){let s=String(v||'').trim();const maps={person:{'利用中':'active','有効':'active','停止中':'inactive','停止':'inactive','保管済み':'archived'},activity:{'スタッフのみ':'staff','一般公開':'public','対象者のみ':'targeted'},shift:{'下書き':'draft','回答受付中':'open','調整中':'open','確定':'confirmed','中止':'cancelled'}};return maps[kind]?.[s]||s||null}async function verify(){let{data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='ログインが必要です。';$('importBtn').disabled=true;return false}let{data:ok}=await sb.rpc('is_system_admin');if(!ok){$('status').textContent='全体管理者のみインポートできます。';$('importBtn').disabled=true;return false}return true}$('importBtn').onclick=async()=>{if(!await verify())return;if(!rows.length)return;for(const req of def.required)if(rows.some(r=>!String(r[req]||'').trim()))return alert(`必須項目 ${req} が空の行があります。`);let payload=[];if(type==='persons')payload=rows.map(r=>({last_name:r.last_name,first_name:r.first_name,last_name_kana:r.last_name_kana||null,first_name_kana:r.first_name_kana||null,birth_date:r.birth_date||null,gender:r.gender||null,phone:r.phone||null,email:r.email||null,status:mapStatus(r.status,'person')||'active',notes:r.notes||null}));if(type==='activities')payload=rows.map(r=>({title:r.title,activity_type:r.activity_type||'other',client_name:r.client_name||null,activity_date:r.activity_date,start_time:r.start_time||null,end_time:r.end_time||null,venue:r.venue||null,venue_address:r.venue_address||null,required_staff:+r.required_staff||1,visibility:mapStatus(r.visibility,'activity')||'staff',notes:r.notes||null,status:'scheduled'}));if(type==='shifts')payload=rows.map(r=>({title:r.title,shift_date:r.shift_date,start_time:r.start_time||null,end_time:r.end_time||null,location:r.location||null,required_count:+r.required_count||1,status:mapStatus(r.status,'shift')||'draft',notes:r.notes||null}));const table={persons:'persons',activities:'labo_activities',shifts:'staff_shift_slots'}[type];const{error}=await sb.from(table).insert(payload);if(error){$('status').textContent='登録できませんでした：'+error.message;$('status').className='status warn';return}$('status').textContent=`${payload.length}件を登録しました。`;$('status').className='status ok';$('importBtn').disabled=true};verify();</script></body></html>
