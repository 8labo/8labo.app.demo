<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>８LABO 本登録</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 760px)/2))}.brand{font-weight:900;font-size:19px}.brand small{display:block;font-size:9px;letter-spacing:.13em;color:var(--muted)}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.8}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:900;color:#4b5563}.choice button.on{background:#111827;color:#fff;border-color:#111827}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:900;color:#596579;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #d7dde4;border-radius:11px;font-size:14px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sub{font-size:11px;color:var(--muted);line-height:1.8}.sectionTitle{font-size:12px;font-weight:900;margin:19px 0 3px;padding-top:14px;border-top:1px solid #eef1f4}.status{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:11px;line-height:1.7}.status.show{display:block}.status.ok{background:#f0fdf4;color:#166534}.status.warn{background:#fff7ed;color:#9a3412}.status.err{background:#fef2f2;color:#991b1b}.primary{width:100%;border:0;border-radius:12px;background:#111827;color:#fff;padding:13px;font-weight:900;margin-top:8px}.hidden{display:none!important}@media(max-width:620px){.row,.choice{grid-template-columns:1fr}}</style></head><body><header><div class="brand">８LABO<small>本登録</small></div><a href="./">← ポータルへ</a></header><main class="wrap"><section class="hero"><h1>８LABO IDを、本登録へ。</h1><p>事前登録済みの方は既存IDへ安全に紐付け、新規の方はここで８LABO IDを自動発行します。初回登録時に今後のサービス利用に必要な基本情報を登録します。</p></section><section class="card"><div class="choice"><button id="selfBtn" class="on">本人として登録</button><button id="guardianBtn">お子さまの保護者として登録</button></div><p id="modeDesc" class="sub">ご本人の情報を入力してください。事前登録がある場合は、氏名・メールアドレス等を照合して既存IDへ紐付けます。</p><div id="guardianFields" class="hidden"><div class="sectionTitle">保護者情報</div><div class="row"><div class="field"><label>保護者 姓 *</label><input id="gLast"></div><div class="field"><label>保護者 名 *</label><input id="gFirst"></div></div><div class="row"><div class="field"><label>保護者 姓（フリガナ）*</label><input id="gLastKana"></div><div class="field"><label>保護者 名（フリガナ）*</label><input id="gFirstKana"></div></div></div><div class="sectionTitle" id="personTitle">本人情報</div><div class="row"><div class="field"><label id="lastLabel">姓 *</label><input id="last"></div><div class="field"><label id="firstLabel">名 *</label><input id="first"></div></div><div class="row"><div class="field"><label id="lastKanaLabel">姓（フリガナ）*</label><input id="lastKana"></div><div class="field"><label id="firstKanaLabel">名（フリガナ）*</label><input id="firstKana"></div></div><div class="row"><div class="field"><label>生年月日 *</label><input id="birth" type="date"></div><div class="field"><label>性別 *</label><select id="gender"><option value="">選択してください</option><option value="male">男性</option><option value="female">女性</option><option value="other">その他</option><option value="no_answer">回答しない</option></select></div></div><div class="field"><label id="phoneLabel">電話番号 *</label><input id="phone" type="tel" inputmode="tel"><div class="sub" id="phoneHelp">ご本人の連絡先を入力してください。</div></div><div class="sectionTitle">ログイン情報</div><div class="field"><label>メールアドレス *</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>新しいパスワード</label><input id="password" type="password" autocomplete="new-password" minlength="8"><div class="sub">初回登録時は8文字以上で設定してください。メール確認済みの場合は再設定不要です。</div></div><button id="submit" class="primary">本登録を開始する</button><div id="status" class="status"></div><p class="sub" style="margin-top:16px">すでにパスワードを設定済みの方は、ポータルの「ログイン」からお入りください。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=id=>document.getElementById(id);let mode='self';function setStatus(t,k='warn'){const e=$('status');e.textContent=t;e.className='status show '+k}function setMode(m){mode=m;$('selfBtn').classList.toggle('on',m==='self');$('guardianBtn').classList.toggle('on',m==='guardian');$('guardianFields').classList.toggle('hidden',m!=='guardian');$('personTitle').textContent=m==='guardian'?'お子さま情報':'本人情報';$('lastLabel').textContent=m==='guardian'?'お子さま 姓 *':'姓 *';$('firstLabel').textContent=m==='guardian'?'お子さま 名 *':'名 *';$('lastKanaLabel').textContent=m==='guardian'?'お子さま 姓（フリガナ）*':'姓（フリガナ）*';$('firstKanaLabel').textContent=m==='guardian'?'お子さま 名（フリガナ）*':'名（フリガナ）*';$('phoneLabel').textContent=m==='guardian'?'保護者電話番号 *':'電話番号 *';$('phoneHelp').textContent=m==='guardian'?'緊急連絡等に使用する保護者の電話番号を入力してください。':'ご本人の連絡先を入力してください。';$('modeDesc').textContent=m==='guardian'?'保護者アカウントを作成し、お子さまの８LABO IDと家族として紐付けます。':'ご本人の情報を入力してください。事前登録がある場合は、既存IDへ紐付けます。'}$('selfBtn').onclick=()=>setMode('self');$('guardianBtn').onclick=()=>setMode('guardian');function pending(){return{mode,gLast:$('gLast').value.trim(),gFirst:$('gFirst').value.trim(),gLastKana:$('gLastKana').value.trim(),gFirstKana:$('gFirstKana').value.trim(),last:$('last').value.trim(),first:$('first').value.trim(),lastKana:$('lastKana').value.trim(),firstKana:$('firstKana').value.trim(),birth:$('birth').value,gender:$('gender').value,phone:$('phone').value.trim(),email:$('email').value.trim().toLowerCase()}}function metadataPending(user){const d=user?.user_metadata||{};if(d.registration_flow!=='8labo_full_registration')return null;return{mode:d.mode||'self',gLast:d.gLast||'',gFirst:d.gFirst||'',gLastKana:d.gLastKana||'',gFirstKana:d.gFirstKana||'',last:d.last||'',first:d.first||'',lastKana:d.lastKana||'',firstKana:d.firstKana||'',birth:d.birth||'',gender:d.gender||'',phone:d.phone||'',email:user.email||d.email||''}}async function getPending(){const raw=localStorage.getItem('8labo_pending_registration');if(raw){try{return JSON.parse(raw)}catch{}}const{data:{user}}=await sb.auth.getUser();return metadataPending(user)}async function claim(p){const{data,error}=await sb.rpc('complete_person_registration',{p_mode:p.mode,p_last_name:p.last,p_first_name:p.first,p_last_name_kana:p.lastKana,p_first_name_kana:p.firstKana,p_birth_date:p.birth,p_gender:p.gender,p_phone:p.phone,p_guardian_last_name:p.mode==='guardian'?p.gLast:null,p_guardian_first_name:p.mode==='guardian'?p.gFirst:null,p_guardian_last_name_kana:p.mode==='guardian'?p.gLastKana:null,p_guardian_first_name_kana:p.mode==='guardian'?p.gFirstKana:null});if(error){setStatus('本登録できませんでした：'+error.message,'err');return false}localStorage.removeItem('8labo_pending_registration');setStatus('本登録が完了しました。事前設定済みのサービス・スタッフ権限がある場合は、そのまま利用できます。','ok');setTimeout(()=>location.href='./',1000);return true}function valid(p){if(!p.last||!p.first||!p.lastKana||!p.firstKana||!p.birth||!p.gender||!p.phone||!p.email)return false;if(p.mode==='guardian'&&(!p.gLast||!p.gFirst||!p.gLastKana||!p.gFirstKana))return false;return true}async function complete(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const p=await getPending();if(!p){setStatus('メール確認は完了しています。必要情報を入力して本登録を完了してください。','warn');return true}await claim(p);return true}$('submit').onclick=async()=>{const p=pending();if(!valid(p))return setStatus('必須項目をすべて入力してください。','err');localStorage.setItem('8labo_pending_registration',JSON.stringify(p));$('submit').disabled=true;const{data:{session}}=await sb.auth.getSession();if(session){const currentEmail=(session.user.email||'').toLowerCase();if(currentEmail&&currentEmail!==p.email){$('submit').disabled=false;return setStatus('現在ログイン中のメールアドレスと入力したメールアドレスが一致しません。いったんログアウトしてからお試しください。','err')}setStatus('８LABO IDとの紐付けを確認しています…','warn');await claim(p);$('submit').disabled=false;return}if(!$('password').value||$('password').value.length<8){$('submit').disabled=false;return setStatus('パスワードは8文字以上で設定してください。','err')}setStatus('アカウントを準備しています…','warn');const redirect='https://8labo.github.io/8labo.app.demo/register.html';const{data,error}=await sb.auth.signUp({email:p.email,password:$('password').value,options:{emailRedirectTo:redirect,data:{registration_flow:'8labo_full_registration',...p}}});$('submit').disabled=false;if(error){if(/already|registered|exists/i.test(error.message))setStatus('このメールアドレスではすでにアカウントが作成されています。ポータルからログインしてください。','err');else setStatus('本登録を開始できませんでした：'+error.message,'err');return}if(data.session){await claim(p)}else setStatus('確認メールを送信しました。メール内のリンクから本登録を続けてください。','ok')};(async()=>{const done=await complete();if(!done){const p=await getPending();if(p){setMode(p.mode||'self');for(const k of ['gLast','gFirst','gLastKana','gFirstKana','last','first','lastKana','firstKana','birth','gender','phone','email'])if($(k))$(k).value=p[k]||''}}})();</script></body></html>
