<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>８LABO 本登録</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 760px)/2))}.brand{font-weight:900;font-size:19px}.brand small{display:block;font-size:9px;letter-spacing:.13em;color:var(--muted)}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.8}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:900;color:#4b5563}.choice button.on{background:#111827;color:#fff;border-color:#111827}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:900;color:#596579;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid #d7dde4;border-radius:11px;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sub{font-size:11px;color:var(--muted);line-height:1.8}.status{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:11px;line-height:1.7}.status.show{display:block}.status.ok{background:#f0fdf4;color:#166534}.status.warn{background:#fff7ed;color:#9a3412}.status.err{background:#fef2f2;color:#991b1b}.primary{width:100%;border:0;border-radius:12px;background:#111827;color:#fff;padding:13px;font-weight:900;margin-top:8px}.hidden{display:none!important}@media(max-width:620px){.row,.choice{grid-template-columns:1fr}}</style></head><body><header><div class="brand">８LABO<small>本登録</small></div><a href="./">← ポータルへ</a></header><main class="wrap"><section class="hero"><h1>８LABO IDを、本登録へ。</h1><p>すでに測定会・ACADEMY等で登録されている情報を、新しいIDを作らずにログインアカウントへ紐付けます。</p></section><section class="card"><div class="choice"><button id="selfBtn" class="on">本人として登録</button><button id="guardianBtn">お子さまの保護者として登録</button></div><p id="modeDesc" class="sub">ご本人の氏名・生年月日・登録済みメールアドレスを照合します。</p><div id="guardianNames" class="hidden"><div class="row"><div class="field"><label>保護者 姓</label><input id="gLast" autocomplete="family-name"></div><div class="field"><label>保護者 名</label><input id="gFirst" autocomplete="given-name"></div></div></div><div class="row"><div class="field"><label id="lastLabel">姓</label><input id="last"></div><div class="field"><label id="firstLabel">名</label><input id="first"></div></div><div class="field"><label>生年月日</label><input id="birth" type="date"></div><div id="phoneWrap" class="field hidden"><label>登録済みの保護者電話番号</label><input id="phone" type="tel" inputmode="tel"><div class="sub">Googleフォーム等で登録した電話番号を入力してください。</div></div><div class="field"><label>登録済みメールアドレス</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>新しいパスワード</label><input id="password" type="password" autocomplete="new-password" minlength="8"><div class="sub">8文字以上で設定してください。</div></div><button id="submit" class="primary">本登録を開始する</button><div id="status" class="status"></div><p class="sub" style="margin-top:16px">すでにパスワードを設定済みの方は、ポータルの「ログイン」からお入りください。</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=id=>document.getElementById(id);let mode='self';function setStatus(t,k='warn'){const e=$('status');e.textContent=t;e.className='status show '+k}function setMode(m){mode=m;$('selfBtn').classList.toggle('on',m==='self');$('guardianBtn').classList.toggle('on',m==='guardian');$('guardianNames').classList.toggle('hidden',m!=='guardian');$('phoneWrap').classList.toggle('hidden',m!=='guardian');$('lastLabel').textContent=m==='guardian'?'お子さま 姓':'姓';$('firstLabel').textContent=m==='guardian'?'お子さま 名':'名';$('modeDesc').textContent=m==='guardian'?'保護者のログインアカウントを作成し、登録済みのお子さまの８LABO IDへ家族として紐付けます。':'ご本人の氏名・生年月日・登録済みメールアドレスを照合します。'}$('selfBtn').onclick=()=>setMode('self');$('guardianBtn').onclick=()=>setMode('guardian');function pending(){return{mode,gLast:$('gLast').value.trim(),gFirst:$('gFirst').value.trim(),last:$('last').value.trim(),first:$('first').value.trim(),birth:$('birth').value,phone:$('phone').value.trim(),email:$('email').value.trim().toLowerCase()}}function metadataPending(user){const d=user?.user_metadata||{};if(d.registration_flow!=='8labo_claim')return null;return{mode:d.mode||'self',gLast:d.gLast||'',gFirst:d.gFirst||'',last:d.last||'',first:d.first||'',birth:d.birth||'',phone:d.phone||'',email:user.email||d.email||''}}async function getPending(){const raw=localStorage.getItem('8labo_pending_registration');if(raw){try{return JSON.parse(raw)}catch{}}const{data:{user}}=await sb.auth.getUser();return metadataPending(user)}async function complete(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const p=await getPending();if(!p){setStatus('メール確認は完了しています。登録情報を確認できないため、もう一度この画面から本登録を開始してください。','warn');return true}let result;if(p.mode==='guardian')result=await sb.rpc('claim_child_and_create_guardian_account',{p_guardian_last_name:p.gLast,p_guardian_first_name:p.gFirst,p_child_last_name:p.last,p_child_first_name:p.first,p_child_birth_date:p.birth,p_phone:p.phone||null});else result=await sb.rpc('claim_existing_person_account',{p_last_name:p.last,p_first_name:p.first,p_birth_date:p.birth});if(result.error){setStatus(result.error.message,'err');return true}localStorage.removeItem('8labo_pending_registration');setStatus('本登録が完了しました。８LABOポータルへ移動します。','ok');setTimeout(()=>location.href='./',900);return true}$('submit').onclick=async()=>{const p=pending();if(!p.last||!p.first||!p.birth||!p.email||!$('password').value)return setStatus('必須項目を入力してください。','err');if(mode==='guardian'&&(!p.gLast||!p.gFirst||!p.phone))return setStatus('保護者氏名と電話番号を入力してください。','err');if($('password').value.length<8)return setStatus('パスワードは8文字以上で設定してください。','err');localStorage.setItem('8labo_pending_registration',JSON.stringify(p));$('submit').disabled=true;setStatus('アカウントを準備しています…','warn');const redirect='https://8labo.github.io/8labo.app.demo/register.html';const{data,error}=await sb.auth.signUp({email:p.email,password:$('password').value,options:{emailRedirectTo:redirect,data:{registration_flow:'8labo_claim',mode:p.mode,gLast:p.gLast,gFirst:p.gFirst,last:p.last,first:p.first,birth:p.birth,phone:p.phone,email:p.email}}});$('submit').disabled=false;if(error){if(/already|registered|exists/i.test(error.message))setStatus('このメールアドレスではすでにアカウントが作成されています。ポータルからログインしてください。','err');else setStatus('本登録を開始できませんでした：'+error.message,'err');return}if(data.session){await complete()}else setStatus('確認メールを送信しました。メール内のリンクを開くと、本登録の紐付けを続行します。','ok')};(async()=>{const done=await complete();if(!done){const p=await getPending();if(p){setMode(p.mode||'self');$('gLast').value=p.gLast||'';$('gFirst').value=p.gFirst||'';$('last').value=p.last||'';$('first').value=p.first||'';$('birth').value=p.birth||'';$('phone').value=p.phone||'';$('email').value=p.email||''}}})();</script></body></html>
