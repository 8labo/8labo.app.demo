<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <title>８LABO DEMO</title>

  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;color:#111827;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #dfe3e8;border-radius:24px;padding:40px;box-shadow:0 14px 40px rgba(0,0,0,.06)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#6b7280}.brand{font-size:34px;font-weight:800;margin:8px 0 10px}.lead{font-size:18px;line-height:1.8;margin:0 0 24px;color:#4b5563}.box{padding:16px 18px;border-radius:16px;background:#f8fafc;font-size:14px;line-height:1.7;color:#475569}</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">DEVELOPMENT PREVIEW</div>
    <h1 class="brand">８LABO</h1>
    <p class="lead">共通WEBアプリの試作・確認環境です。</p>
    <div class="box">人物・家族・サービス利用・測定データなどの共通基盤を軸に、ACADEMYやBizFitへ自然につながる新しい入口をここで設計していきます。</div>
  </main>
