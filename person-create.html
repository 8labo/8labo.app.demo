<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物を新規作成｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 820px)/2))}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(820px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:4px 0;font-size:23px}.hero p{margin:8px 0 0;color:#cbd5e1;font-size:11px;line-height:1.7}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode label{border:1px solid var(--line);border-radius:14px;padding:13px;cursor:pointer}.mode label:has(input:checked){border-color:#111827;background:#f8fafc}.mode b{display:block;font-size:12px}.mode small{display:block;color:var(--muted);font-size:9px;line-height:1.6;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:11px}.field label{display:block;font-size:9px;color:var(--muted);font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #d7dde5;border-radius:10px;padding:10px;background:#fff}.notice{font-size:10px;line-height:1.7;color:#64748b;background:#f8fafc;border-radius:12px;padding:11px;margin-top:12px}.warn{background:#fff7ed;color:#9a3412}.btn{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:#fff;font-size:10px;font-weight:900;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.5}.status{margin-top:14px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:11px}.ok{background:#f0fdf4;color:#166534}.err{background:#fef2f2;color:#991b1b}.hidden{display:none!important}@media(max-width:700px){.mode,.grid{grid-template-columns:1fr}}</style></head><body><header><b>８LABO 人物新規作成</b><a href="portal-admin.html">← 人物一覧へ</a></header><main class="wrap"><section class="hero"><h1>通常連番と指定IDを安全に使い分け</h1><p>通常採番では使用済み番号を自動でスキップします。指定IDは全体管理者専用で、通常連番を消費しません。</p></section><div id="status" class="status">管理者権限を確認しています…</div><section id="app" class="card hidden"><div class="mode"><label><input type="radio" name="mode" value="auto" checked> <b>通常採番</b><small>通常の人物登録に使用。現在の連番から空いている番号を安全に採番します。</small></label><label><input type="radio" name="mode" value="specified"> <b>IDを指定して作成</b><small>テスト人物・運営用など。通常の連番を進めず、指定番号を直接割り当てます。</small></label></div><div id="specifiedBox" class="field hidden"><label>指定する８LABO ID</label><input id="laboId" type="number" min="1" inputmode="numeric" placeholder="例：888"><div class="notice warn">指定番号がすでに使われている場合は作成されません。通常の連番には影響しません。</div></div><div class="grid"><div class="field"><label>姓 *</label><input id="lastName" autocomplete="off"></div><div class="field"><label>名 *</label><input id="firstName" autocomplete="off"></div><div class="field"><label>生年月日</label><input id="birth" type="date"></div><div class="field"><label>連絡先メール</label><input id="email" type="email" autocomplete="off"></div><div class="field"><label>電話番号</label><input id="phone" autocomplete="off"></div></div><div class="field"><label>備考</label><textarea id="notes" rows="3" placeholder="例：スタッフ権限確認用テスト人物"></textarea></div><div class="notice">この画面では人物データのみ作成します。ログインアカウントやスタッフ権限は、作成後に人物管理から設定してください。</div><button id="create" class="btn">人物を作成</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id),fmt=n=>String(n).padStart(4,'0');let ready=false;function setStatus(t,type=''){const s=$('status');s.textContent=t;s.className='status '+type}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return setStatus('管理者としてログインしてください。','err');const{data:ok,error}=await sb.rpc('is_system_admin');if(error||!ok)return setStatus('全体管理者のみ利用できます。','err');ready=true;$('app').classList.remove('hidden');setStatus('全体管理者として接続しています。','ok')}document.querySelectorAll('input[name="mode"]').forEach(r=>r.onchange=()=>{$('specifiedBox').classList.toggle('hidden',document.querySelector('input[name="mode"]:checked').value!=='specified')});$('create').onclick=async()=>{if(!ready)return;const mode=document.querySelector('input[name="mode"]:checked').value,last=$('lastName').value.trim(),first=$('firstName').value.trim();if(!last||!first)return setStatus('姓・名は必須です。','err');const common={p_last_name:last,p_first_name:first,p_birth_date:$('birth').value||null,p_email:$('email').value.trim()||null,p_phone:$('phone').value.trim()||null,p_notes:$('notes').value.trim()||null};if(mode==='specified'){const id=Number($('laboId').value);if(!Number.isInteger(id)||id<1)return setStatus('指定する８LABO IDは1以上の整数で入力してください。','err');if(!confirm(`８LABO ID ${fmt(id)} を指定して ${last} ${first} を作成します。通常連番は消費しません。よろしいですか？`))return}const btn=$('create');btn.disabled=true;btn.textContent='作成中…';try{let result;if(mode==='specified'){result=await sb.rpc('admin_create_person_with_labo_id',{p_labo_id:Number($('laboId').value),...common})}else{result=await sb.rpc('admin_create_person_auto',common)}if(result.error)throw result.error;const personId=mode==='specified'?result.data:result.data?.person_id,labo=mode==='specified'?Number($('laboId').value):result.data?.labo_id;setStatus(`８LABO ID ${fmt(labo)}｜${last} ${first} を作成しました。`,'ok');setTimeout(()=>{location.href='person-detail.html?person='+encodeURIComponent(personId)},700)}catch(e){setStatus(e.message||String(e),'err');btn.disabled=false;btn.textContent='人物を作成'}};boot();</script></body></html>
