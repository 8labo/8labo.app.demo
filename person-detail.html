<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物カルテ｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 900px)/2))}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:26px 0 60px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:4px 0;font-size:25px}.hero small{color:#cbd5e1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{font-size:15px;margin:0 0 12px}.line{padding:9px 0;border-top:1px solid #eef1f4}.line:first-of-type{border-top:0}.label{font-size:9px;color:#8993a2;font-weight:800}.value{font-size:12px;margin-top:3px}.badge{display:inline-block;font-size:9px;font-weight:900;padding:5px 8px;border-radius:999px;background:#eef2f7;margin:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;background:#111827;color:#fff!important;padding:10px 12px;border-radius:10px;font-size:10px;font-weight:900}.ghost{background:#fff;color:#111827!important;border:1px solid var(--line)}.notice{font-size:10px;color:#6b7280;line-height:1.7;background:#f8fafc;border-radius:12px;padding:11px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>８LABO 人物カルテ</b><a href="portal-admin.html">← 人物一覧へ</a></header><main class="wrap"><div id="status" class="card">情報を読み込んでいます…</div><section id="app" class="hidden"><div class="hero"><small>PERSON PROFILE</small><h1 id="name"></h1><small id="laboId"></small><div class="actions"><a id="preview" class="btn">会員表示をプレビュー</a><a href="portal-admin.html" class="btn ghost">管理画面に戻る</a></div></div><div class="grid"><div class="card"><h2>基本情報</h2><div id="basic"></div></div><div class="card"><h2>アカウント</h2><div id="account"></div></div><div class="card"><h2>サービス利用</h2><div id="services"></div></div><div class="card"><h2>家族・関係者</h2><div id="relations"></div></div><div class="card"><h2>スタッフ情報</h2><div id="staff"></div></div><div class="card"><h2>セキュリティ</h2><div class="notice">現在のパスワードは管理者を含め誰にも表示しません。必要な場合はパスワード再設定を行う設計です。ログイン用メールアドレスの認証状態は、今後Auth管理情報との安全な連携を追加して表示できるようにします。</div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=n=>String(n).padStart(4,'0');const row=(l,v)=>`<div class="line"><div class="label">${l}</div><div class="value">${esc(v||'—')}</div></div>`;async function boot(){const id=new URLSearchParams(location.search).get('person');if(!id)return $('status').textContent='対象人物が指定されていません。';const{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='管理者としてログインしてください。';const{data:ok}=await sb.rpc('is_system_admin');if(!ok)return $('status').textContent='全体管理者のみ利用できます。';let r=await sb.from('persons').select('*').eq('id',id).single();if(r.error)return $('status').textContent='人物情報を取得できません。';const p=r.data;const [{data:ac},{data:ms},{data:rels},{data:su},{data:roles},{data:ss}]=await Promise.all([sb.from('user_accounts').select('*').eq('person_id',id).maybeSingle(),sb.from('service_memberships').select('*,services(service_code,service_name)').eq('person_id',id),sb.from('person_relationships').select('*').or(`from_person_id.eq.${id},to_person_id.eq.${id}`).eq('status','active'),sb.from('staff_users').select('*').eq('person_id',id).maybeSingle(),sb.from('staff_roles').select('*'),sb.from('services').select('*')]);let others=[];for(const x of rels||[]){const oid=x.from_person_id===id?x.to_person_id:x.from_person_id;const{data:o}=await sb.from('persons').select('id,labo_id,last_name,first_name').eq('id',oid).single();if(o)others.push({rel:x,person:o,direction:x.from_person_id===id?'out':'in'})}let ra=[];if(su){const{data:a}=await sb.from('staff_role_assignments').select('*').eq('staff_user_id',su.id).eq('status','active');ra=a||[]} $('status').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=p.last_name+' '+p.first_name;$('laboId').textContent='８LABO ID '+fmt(p.labo_id);$('preview').href='member-preview.html?person='+encodeURIComponent(id);$('basic').innerHTML=row('氏名',p.last_name+' '+p.first_name)+row('フリガナ',[p.last_name_kana,p.first_name_kana].filter(Boolean).join(' '))+row('生年月日',p.birth_date)+row('性別',p.gender)+row('電話番号',p.phone)+row('連絡先メール',p.email)+row('人物状態',p.status)+row('備考',p.notes);$('account').innerHTML=row('ログインアカウント',ac?(ac.account_status==='active'?'利用可能':'停止中'):'未登録')+row('アカウント作成日',ac?.created_at)+row('更新日',ac?.updated_at);$('services').innerHTML=(ms||[]).length?(ms||[]).map(x=>`<div class="line"><b>${esc(x.services?.service_name||'サービス')}</b><span class="badge">${esc(x.membership_status)}</span><div class="label">開始 ${esc(x.started_at||'—')} / 終了 ${esc(x.ended_at||'—')}</div></div>`).join(''):'<div class="notice">利用サービスはありません。</div>';$('relations').innerHTML=others.length?others.map(x=>`<div class="line"><b>${esc(x.person.last_name+' '+x.person.first_name)}</b><div class="label">ID ${fmt(x.person.labo_id)}｜${esc(x.rel.relationship_label||x.rel.relationship_type)}</div></div>`).join(''):'<div class="notice">登録された家族・関係者はいません。</div>';$('staff').innerHTML=su?row('スタッフ状態',su.staff_status)+(ra.map(a=>{const rr=(roles||[]).find(x=>x.id===a.role_id),sv=(ss||[]).find(x=>x.id===a.service_id);return `<span class="badge">${esc(sv?.service_name||'８LABO全体')}｜${esc(rr?.role_name||rr?.role_code)}</span>`}).join('')||'<div class="notice">有効な権限はありません。</div>'):'<div class="notice">スタッフではありません。</div>'}boot();</script></body></html>
