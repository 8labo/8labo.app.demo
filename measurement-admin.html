<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 測定管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1080px)/2))}header a{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1080px,calc(100% - 28px));margin:auto;padding:22px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{font-size:22px;margin:0 0 6px}.hero p{font-size:11px;color:#cbd5e1;margin:0}.grid{display:grid;grid-template-columns:380px 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 4px}.sub,.meta{font-size:10px;color:var(--muted);line-height:1.6}.field{margin:10px 0}.field label{display:block;font-size:9px;font-weight:850;color:#64748b;margin-bottom:5px}.field input,.field select{width:100%;padding:9px;border:1px solid #d8dee6;border-radius:9px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:900;background:#111827;color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#111827;border:1px solid var(--line)}.item{padding:11px 0;border-top:1px solid #eef1f4}.item b{font-size:12px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f7;font-size:8px;font-weight:900;margin-left:5px}.open{background:#eaf7ef;color:#17633e}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:10px;font-weight:850}.tabs button.on{background:#111827;color:#fff}.pane{display:none}.pane.on{display:block}.status{padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:11px}.hidden{display:none!important}@media(max-width:760px){.grid,.row2{grid-template-columns:1fr}}</style></head><body><header><b>８LABO 測定管理</b><a href="staff.html">← 管理一覧に戻る</a></header><main class="wrap"><section class="hero"><h1>測定イベントと申込を管理</h1><p>申込時間枠、受付状態、参加者情報、スポーツプロフィールを一元管理します。</p></section><div id="status" class="status">権限を確認しています…</div><section id="app" class="grid hidden"><div><div class="card"><h2>測定イベントを登録</h2><div class="field"><label>イベント名</label><input id="name"></div><div class="row2"><div class="field"><label>実施日</label><input id="date" type="date"></div><div class="field"><label>会場</label><input id="location"></div></div><div class="field"><label>申込状態</label><select id="regStatus"><option value="closed">受付前・停止</option><option value="open">受付中</option></select></div><button id="saveSession" class="btn">登録する</button></div><div class="card"><h2>時間枠を追加</h2><div class="field"><label>対象イベント</label><select id="slotSession"></select></div><div class="field"><label>表示名</label><input id="slotLabel" placeholder="例：第1部"></div><div class="row2"><div class="field"><label>開始</label><input id="slotStart" type="time"></div><div class="field"><label>終了</label><input id="slotEnd" type="time"></div></div><div class="field"><label>定員（任意）</label><input id="slotCapacity" type="number" min="1"></div><button id="saveSlot" class="btn">時間枠を追加</button></div></div><div><div class="card"><div class="tabs"><button class="on" data-pane="events">イベント</button><button data-pane="registrations">申込者</button></div><section id="events" class="pane on"><div id="eventList"></div></section><section id="registrations" class="pane"><div class="field"><label>イベント</label><select id="regSession"></select></div><div id="regList"></div></section></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);let sessions=[],slots=[],regs=[],people=[],sportVersions=[],sports=[],schools=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.pane))});async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='ログインが必要です。';const{data:ok}=await sb.rpc('is_system_admin');if(!ok)return $('status').textContent='全体管理者権限が必要です。';$('app').classList.remove('hidden');$('status').textContent='測定管理を利用できます。';await load()}async function load(){let r=await sb.from('assessment_sessions').select('*').order('assessment_date',{ascending:false});sessions=r.data||[];r=await sb.from('assessment_event_time_slots').select('*').order('sort_order');slots=r.data||[];r=await sb.from('assessment_registrations').select('*').order('registered_at',{ascending:false});regs=r.data||[];r=await sb.from('persons').select('id,labo_id,last_name,first_name');people=r.data||[];r=await sb.from('person_sport_profile_versions').select('*');sportVersions=r.data||[];if(sportVersions.length){r=await sb.from('person_sport_profile_sports').select('*').in('profile_version_id',sportVersions.map(x=>x.id));sports=r.data||[]}r=await sb.from('person_school_profile_versions').select('*');schools=r.data||[];const opts=sessions.map(s=>`<option value="${s.id}">${s.assessment_date}｜${esc(s.session_name)}</option>`).join('');$('slotSession').innerHTML=opts;$('regSession').innerHTML=opts;renderEvents();renderRegs()}function renderEvents(){$('eventList').innerHTML=sessions.map(s=>{let ss=slots.filter(x=>x.session_id===s.id);return `<div class="item"><b>${s.assessment_date}｜${esc(s.session_name)}</b><span class="badge ${s.registration_status==='open'?'open':''}">${s.registration_status==='open'?'受付中':'受付停止'}</span><div class="meta">${esc(s.location||'')}<br>${ss.length?ss.map(x=>`${esc(x.label)} ${x.start_time?.slice(0,5)||''}〜${x.end_time?.slice(0,5)||''}`).join(' / '):'時間枠未設定'}</div><button class="btn ghost" data-toggle="${s.id}" style="margin-top:7px">${s.registration_status==='open'?'受付を停止':'受付を開始'}</button></div>`}).join('')||'<div class="meta">測定イベントはありません。</div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{let s=sessions.find(x=>x.id===b.dataset.toggle);await sb.from('assessment_sessions').update({registration_status:s.registration_status==='open'?'closed':'open',updated_at:new Date().toISOString()}).eq('id',s.id);load()})}function renderRegs(){let sid=$('regSession').value,list=regs.filter(x=>x.session_id===sid);$('regList').innerHTML=list.map(r=>{let p=people.find(x=>x.id===r.person_id),v=sportVersions.find(x=>x.id===r.sport_profile_version_id),main=sports.find(x=>x.profile_version_id===v?.id&&x.is_primary),sc=schools.find(x=>x.id===r.school_profile_version_id),a=slots.find(x=>x.id===r.first_choice_slot_id),b=slots.find(x=>x.id===r.second_choice_slot_id);return `<div class="item"><b>ID ${String(p?.labo_id||'').padStart(4,'0')}｜${esc((p?.last_name||'')+' '+(p?.first_name||''))}</b><div class="meta">第1希望：${esc(a?.label||'—')} / 第2希望：${esc(b?.label||'—')}<br>学校：${esc(sc?.school_name||'—')} ${esc(sc?.grade_label||'')}<br>主競技：${esc(main?.sport_name||'—')}｜競技歴 ${main?.years_experience??'—'}年｜週 ${v?.activity_frequency_per_week??'—'}回｜${esc(v?.team_status||'—')}｜${esc(v?.competition_level||'—')}</div></div>`}).join('')||'<div class="meta">申込者はいません。</div>'}$('regSession').onchange=renderRegs;$('saveSession').onclick=async()=>{if(!$('name').value||!$('date').value)return alert('イベント名と実施日は必須です。');const{error}=await sb.from('assessment_sessions').insert({session_name:$('name').value,assessment_date:$('date').value,location:$('location').value||null,registration_status:$('regStatus').value});if(error)return alert(error.message);['name','date','location'].forEach(x=>$(x).value='');await load()};$('saveSlot').onclick=async()=>{if(!$('slotSession').value||!$('slotLabel').value)return alert('対象イベントと表示名は必須です。');const existing=slots.filter(x=>x.session_id===$('slotSession').value);const{error}=await sb.from('assessment_event_time_slots').insert({session_id:$('slotSession').value,label:$('slotLabel').value,start_time:$('slotStart').value||null,end_time:$('slotEnd').value||null,capacity:$('slotCapacity').value||null,sort_order:existing.length+1});if(error)return alert(error.message);['slotLabel','slotStart','slotEnd','slotCapacity'].forEach(x=>$(x).value='');await load()};boot();</script></body></html>
