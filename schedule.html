<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO スケジュール管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#0b4f8a;--orange:#d97706;--red:#b42318;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.brand{font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted)}.back{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:24px;padding:26px}.hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.status{margin:14px 0;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:11px;color:#4b5563}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.toolbar button,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-size:11px;font-weight:800}.toolbar button.on{background:#111827;color:#fff}.monthNav{display:flex;align-items:center;gap:8px;margin-left:auto}.monthNav b{font-size:13px}.view{display:none}.view.on{display:block}.calendar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:10px;color:#8b95a3;padding:5px}.day{min-height:118px;border:1px solid #edf0f3;border-radius:13px;padding:7px;background:#fbfcfd}.day.off{opacity:.35}.dayNum{font-size:10px;font-weight:900;margin-bottom:5px}.ev{display:block;width:100%;border:0;border-radius:8px;padding:6px 7px;margin:4px 0;text-align:left;font-size:9px;line-height:1.35;background:#edf5fb;color:#24577c;cursor:pointer}.ev.biz{background:#fff3e5;color:#9a5a0a}.ev.warn{box-shadow:inset 0 0 0 1.5px #efb5b5}.listCard{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:14px;border-bottom:1px solid #edf0f3;background:#fafbfc}.field label{display:block;font-size:9px;font-weight:850;color:#687385;margin-bottom:4px}.field input{width:100%;border:1px solid #d7dde5;border-radius:10px;padding:9px}.bulk .field{width:120px}.btn{border:0;border-radius:10px;padding:10px 12px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#111827;color:#fff}.blue{background:var(--blue);color:#fff}.light{background:#eef1f4;color:#374151}.rows{overflow:auto}.row{display:grid;grid-template-columns:34px 105px 95px 1.5fr 125px 150px 80px 90px;gap:8px;align-items:center;padding:11px 13px;border-top:1px solid #f0f2f4;font-size:10px}.row.head{font-weight:900;color:#667085;background:#fafbfc;border-top:0}.title{font-size:11px;font-weight:850}.muted{color:#7d8796;font-size:9px;margin-top:3px}.badge{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:900;background:#eef2f7}.badge.warn{background:#fff0f0;color:#a33}.badge.ok{background:#eaf7ef;color:#20704a}.alertbox{margin:14px 0;background:#fff;border:1px solid #f0c8c8;border-radius:18px;padding:15px}.alertbox h3{font-size:14px;margin:0 0 8px;color:#9b2c2c}.alert{padding:8px 0;border-top:1px solid #f6e6e6;font-size:10px;line-height:1.6}.alert:first-of-type{border-top:0}.empty{font-size:11px;color:#9ca3af;padding:18px}.hidden{display:none!important}@media(max-width:880px){.row{grid-template-columns:32px 88px 1fr 110px}.row>div:nth-child(3),.row>div:nth-child(6),.row>div:nth-child(7),.row>div:nth-child(8){display:none}.monthNav{margin-left:0}.day{min-height:92px}.ev{font-size:8px;padding:5px}.bulk .field{width:calc(50% - 5px)}}</style></head><body><header class="top"><div class="brand">８LABO スケジュール管理<small>全サービス共通</small></div><a class="back" href="staff.html">← スタッフメニューに戻る</a></header><main class="wrap"><section class="hero"><h1>全サービスの予定を、ひとつに。</h1><p>ACADEMY・BizFitクラブなど各サービスで登録された予定を自動で読み込み、スタッフ時間の設定とシフト調整をここから行います。</p></section><div id="status" class="status">予定を読み込んでいます…</div><div class="toolbar"><button id="calBtn" class="on">カレンダー</button><button id="listBtn">一覧</button><select id="serviceFilter"><option value="ALL">すべてのサービス</option><option value="ACADEMY">ACADEMY</option><option value="BIZFIT">BizFitクラブ</option></select><div class="monthNav"><button id="prev">‹</button><b id="monthLabel"></b><button id="next">›</button></div></div><section id="alerts" class="alertbox hidden"><h3>時間の重なりを確認してください</h3><div id="alertList"></div></section><section id="calendarView" class="view on"><div class="calendar"><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="days" class="days"></div></div></section><section id="listView" class="view"><div class="listCard"><div class="bulk"><div class="field"><label>集合</label><input id="before" type="number" min="0" value="20"></div><div class="field"><label>解散</label><input id="after" type="number" min="0" value="10"></div><div class="field"><label>必要人数</label><input id="count" type="number" min="1" value="1"></div><button id="apply" class="btn blue">選択した予定に一括設定</button><button id="startShift" class="btn primary">選択した予定でシフト調整開始</button><button id="clearSel" class="btn light">選択解除</button></div><div class="rows"><div class="row head"><div></div><div>日程</div><div>サービス</div><div>予定</div><div>参加者時間</div><div>スタッフ時間</div><div>人数</div><div>状態</div></div><div id="rows"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let month=new Date();month=new Date(month.getFullYear(),month.getMonth(),1);let events=[],selected=new Set(),canManage=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const t=s=>s?s.slice(0,5):'—';function addMin(time,min){if(!time)return null;let[a,b]=time.slice(0,5).split(':').map(Number),m=a*60+b+min;m=(m+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function key(e){return e.source_type+'|'+e.source_event_id}function filtered(){return events.filter(e=>$('serviceFilter').value==='ALL'||e.service_code===$('serviceFilter').value)}function conflicts(){const list=filtered(),out=[];for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){let a=list[i],b=list[j];if(a.event_date!==b.event_date||!a.start_time||!a.end_time||!b.start_time||!b.end_time)continue;let as=a.start_time.slice(0,5),ae=a.end_time.slice(0,5),bs=b.start_time.slice(0,5),be=b.end_time.slice(0,5);let participant=as<be&&bs<ae;let ass=addMin(as,-(a.before_minutes||0)),ase=addMin(ae,a.after_minutes||0),bss=addMin(bs,-(b.before_minutes||0)),bse=addMin(be,b.after_minutes||0);let staff=ass&&bse&&bss&&ase&&ass<bse&&bss<ase;if(participant||staff)out.push({a,b,participant,staff})}return out}function isWarn(e){return conflicts().some(x=>key(x.a)===key(e)||key(x.b)===key(e))}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='８LABOポータルからログインしてください。';return}const {data:sid}=await sb.rpc('current_staff_id');if(!sid){$('status').textContent='スタッフ権限がありません。';return}const {data:sys}=await sb.rpc('is_system_admin');canManage=!!sys;if(!canManage){const {data:ss}=await sb.from('services').select('id');for(const s of ss||[]){const {data:ok}=await sb.rpc('can_manage_shifts',{target_service_id:s.id});if(ok){canManage=true;break}}}await load()}async function load(){let from=ymd(new Date(month.getFullYear(),month.getMonth()-1,1)),to=ymd(new Date(month.getFullYear(),month.getMonth()+2,0));const {data,error}=await sb.rpc('get_staff_unified_schedule',{p_from:from,p_to:to});if(error){$('status').textContent='予定を読み込めませんでした：'+error.message;return}events=data||[];$('status').textContent=`ACADEMY・BizFitクラブから ${events.length}件の予定を読み込みました。`;render()}function render(){renderCal();renderList();renderAlerts();$('monthLabel').textContent=`${month.getFullYear()}年 ${month.getMonth()+1}月`}function renderCal(){let first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html='',list=filtered();for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=ymd(d),off=d.getMonth()!==month.getMonth(),evs=list.filter(e=>e.event_date===date);html+=`<div class="day ${off?'off':''}"><div class="dayNum">${d.getDate()}</div>${evs.map(e=>`<button class="ev ${e.service_code==='BIZFIT'?'biz':''} ${isWarn(e)?'warn':''}" data-open="${key(e)}">${t(e.start_time)} ${esc(e.title)}</button>`).join('')}</div>`}$('days').innerHTML=html;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected.add(b.dataset.open);showList()})}function renderList(){let list=filtered().filter(e=>e.event_date.startsWith(`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`));$('rows').innerHTML=list.map(e=>{let k=key(e),staff=e.start_time&&e.end_time?`${addMin(e.start_time,-(e.before_minutes||0))}〜${addMin(e.end_time,e.after_minutes||0)}`:'未設定';return `<div class="row"><div><input type="checkbox" data-sel="${k}" ${selected.has(k)?'checked':''}></div><div>${e.event_date}<div class="muted">${e.group_name?esc(e.group_name):''}</div></div><div><span class="badge">${e.service_code==='ACADEMY'?'ACADEMY':'BizFit'}</span></div><div><div class="title">${esc(e.title)}</div>${isWarn(e)?'<div class="muted" style="color:#a33">⚠ 時間重複あり</div>':''}</div><div>${t(e.start_time)}〜${t(e.end_time)}</div><div>${staff}<div class="muted">前${e.before_minutes||0}分 / 後${e.after_minutes||0}分</div></div><div>${e.required_count||1}名</div><div>${e.shift_enabled?'<span class="badge ok">シフト調整中</span>':'<span class="badge">未調整</span>'}</div></div>`}).join('')||'<div class="empty">この月の予定はありません。</div>';document.querySelectorAll('[data-sel]').forEach(x=>x.onchange=()=>{x.checked?selected.add(x.dataset.sel):selected.delete(x.dataset.sel)})}function renderAlerts(){let cs=conflicts().filter(x=>x.a.event_date.startsWith(`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`));$('alerts').classList.toggle('hidden',!cs.length);$('alertList').innerHTML=cs.map(x=>`<div class="alert"><b>${x.a.event_date}</b>｜${esc(x.a.title)} × ${esc(x.b.title)}<br>${x.participant?'参加者向け時間が重複しています。':''}${x.participant&&x.staff?' ':''}${x.staff?'スタッフ時間も重複します。':''}</div>`).join('')}function showList(){$('calBtn').classList.remove('on');$('listBtn').classList.add('on');$('calendarView').classList.remove('on');$('listView').classList.add('on');renderList()}$('calBtn').onclick=()=>{$('calBtn').classList.add('on');$('listBtn').classList.remove('on');$('calendarView').classList.add('on');$('listView').classList.remove('on')};$('listBtn').onclick=showList;$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);load()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);load()};$('serviceFilter').onchange=render;$('clearSel').onclick=()=>{selected.clear();renderList()};async function apply(enable){if(!canManage)return alert('シフト管理権限がありません。');if(!selected.size)return alert('予定を選択してください。');let before=+$('before').value||0,after=+$('after').value||0,count=+$('count').value||1;for(const k of [...selected]){let e=events.find(x=>key(x)===k);if(!e)continue;const {error}=await sb.rpc('set_schedule_staff_settings',{p_source_type:e.source_type,p_source_event_id:e.source_event_id,p_before_minutes:before,p_after_minutes:after,p_required_count:count,p_shift_enabled:enable});if(error)return alert(`${e.title}：${error.message}`)}await load();alert(enable?'選択した予定でシフト調整を開始しました。':'スタッフ時間を設定しました。')} $('apply').onclick=()=>apply(false);$('startShift').onclick=()=>apply(true);boot();</script></body></html>
