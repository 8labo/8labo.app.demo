<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO スケジュール管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.brand{font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted)}.back{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 70px}.status{margin-bottom:14px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:11px;color:#4b5563}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar button,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-size:11px;font-weight:800}.toolbar button.on{background:#111827;color:#fff}.monthNav{display:flex;align-items:center;gap:8px;margin-left:auto}.monthNav b{font-size:13px}.view{display:none}.view.on{display:block}.calendar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:10px;color:#8b95a3;padding:5px}.day{min-height:118px;border:1px solid #edf0f3;border-radius:13px;padding:7px;background:#fbfcfd}.day.off{opacity:.35}.dayNum{font-size:10px;font-weight:900;margin-bottom:5px}.ev{display:block;width:100%;border:0;border-radius:8px;padding:6px 7px;margin:4px 0;text-align:left;font-size:9px;line-height:1.35;background:#edf5fb;color:#24577c}.ev.biz{background:#fff3e5;color:#9a5a0a}.ev.warn{box-shadow:inset 0 0 0 1.5px #efb5b5}.listCard{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.row{display:grid;grid-template-columns:105px 100px 1.5fr 130px 1fr;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #f0f2f4;font-size:10px}.row.head{font-weight:900;color:#667085;background:#fafbfc;border-top:0}.title{font-size:11px;font-weight:850}.muted{color:#7d8796;font-size:9px;margin-top:3px}.badge{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:8px;font-weight:900;background:#eef2f7}.alertbox{margin:0 0 14px;background:#fff;border:1px solid #f0c8c8;border-radius:18px;padding:15px}.alertbox h3{font-size:14px;margin:0 0 8px;color:#9b2c2c}.alert{padding:8px 0;border-top:1px solid #f6e6e6;font-size:10px;line-height:1.6}.hidden{display:none!important}.empty{font-size:11px;color:#9ca3af;padding:18px}@media(max-width:760px){.row{grid-template-columns:85px 1fr 100px}.row>div:nth-child(2),.row>div:nth-child(5){display:none}.monthNav{margin-left:0}.day{min-height:92px}}</style></head><body><header class="top"><div class="brand">８LABO スケジュール管理<small>全サービス共通</small></div><a class="back" href="staff.html">← 管理一覧に戻る</a></header><main class="wrap"><div id="status" class="status">予定を読み込んでいます…</div><div class="toolbar"><button id="calBtn" class="on">カレンダー</button><button id="listBtn">一覧</button><select id="serviceFilter"><option value="ALL">すべて</option><option value="ACADEMY">ACADEMY</option><option value="BIZFIT">BizFitクラブ</option><option value="ACTIVITY">８LABO活動</option></select><div class="monthNav"><button id="prev">‹</button><b id="monthLabel"></b><button id="next">›</button></div></div><section id="alerts" class="alertbox hidden"><h3>時間の重なりを確認してください</h3><div id="alertList"></div></section><section id="calendarView" class="view on"><div class="calendar"><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="days" class="days"></div></div></section><section id="listView" class="view"><div class="listCard"><div class="row head"><div>日程</div><div>サービス</div><div>予定</div><div>時間</div><div>会場・教室</div></div><div id="rows"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);let month=new Date();month=new Date(month.getFullYear(),month.getMonth(),1);let events=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),tm=s=>s?s.slice(0,5):'—';function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function filtered(){let v=$('serviceFilter').value;return events.filter(e=>v==='ALL'||e.service_code===v)}function conflicts(){let a=filtered(),out=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){let x=a[i],y=a[j];if(x.event_date!==y.event_date||!x.start_time||!x.end_time||!y.start_time||!y.end_time)continue;if(x.start_time<y.end_time&&y.start_time<x.end_time)out.push([x,y])}return out}function warn(e){return conflicts().some(x=>x.includes(e))}async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='８LABOポータルからログインしてください。';let{data:sid}=await sb.rpc('current_staff_id');let{data:admin}=await sb.rpc('is_system_admin');if(!sid&&!admin)return $('status').textContent='スタッフ権限がありません。';load()}async function load(){let from=ymd(new Date(month.getFullYear(),month.getMonth()-1,1)),to=ymd(new Date(month.getFullYear(),month.getMonth()+2,0));let{data,error}=await sb.rpc('get_staff_unified_schedule',{p_from:from,p_to:to});if(error)return $('status').textContent='予定を読み込めませんでした：'+error.message;events=data||[];$('status').textContent=`${events.length}件の予定を読み込みました。シフトの設定・調整は「シフト管理」で行います。`;render()}function render(){let ym=`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`;$('monthLabel').textContent=`${month.getFullYear()}年 ${month.getMonth()+1}月`;let first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html='',list=filtered();for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=ymd(d),off=d.getMonth()!==month.getMonth();html+=`<div class="day ${off?'off':''}"><div class="dayNum">${d.getDate()}</div>${list.filter(e=>e.event_date===date).map(e=>`<div class="ev ${e.service_code==='BIZFIT'?'biz':''} ${warn(e)?'warn':''}">${tm(e.start_time)} ${esc(e.title)}</div>`).join('')}</div>`}$('days').innerHTML=html;let m=list.filter(e=>e.event_date.startsWith(ym));$('rows').innerHTML=m.map(e=>`<div class="row"><div>${e.event_date}</div><div><span class="badge">${esc(e.service_code||'活動')}</span></div><div><div class="title">${esc(e.title)}</div>${warn(e)?'<div class="muted" style="color:#a33">⚠ 時間重複あり</div>':''}</div><div>${tm(e.start_time)}〜${tm(e.end_time)}</div><div>${esc(e.group_name||e.location||'—')}</div></div>`).join('')||'<div class="empty">この月の予定はありません。</div>';let cs=conflicts().filter(x=>x[0].event_date.startsWith(ym));$('alerts').classList.toggle('hidden',!cs.length);$('alertList').innerHTML=cs.map(([a,b])=>`<div class="alert"><b>${a.event_date}</b>｜${esc(a.title)} × ${esc(b.title)}<br>予定時間が重複しています。</div>`).join('')}function show(v){$('calBtn').classList.toggle('on',v==='cal');$('listBtn').classList.toggle('on',v==='list');$('calendarView').classList.toggle('on',v==='cal');$('listView').classList.toggle('on',v==='list')}$('calBtn').onclick=()=>show('cal');$('listBtn').onclick=()=>show('list');$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);load()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);load()};$('serviceFilter').onchange=render;boot();</script></body></html>
