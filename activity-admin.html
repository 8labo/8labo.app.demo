<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 活動管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1050px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:25px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:390px 1fr;gap:15px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px}.card h2{font-size:16px;margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:850;color:#596579;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e0e7;border-radius:10px;background:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{border:0;border-radius:11px;background:#111827;color:#fff;padding:11px 14px;font-weight:900}.status{font-size:11px;color:#64748b;margin:12px 0}.item{padding:12px 0;border-top:1px solid #eef1f4}.item:first-child{border-top:0}.item b{font-size:13px}.meta{font-size:10px;color:#7b8796;margin-top:5px;line-height:1.6}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:8px;font-weight:900;margin-left:5px}.staff{background:#eef2f6}.public{background:#eaf7ef;color:#17633e}.targeted{background:#eef5fb;color:#285c83}.hidden{display:none!important}@media(max-width:760px){.grid,.row2{grid-template-columns:1fr}}</style></head><body><header><div class="brand">８LABO 活動管理<small>会員サービス外の活動</small></div><a href="staff.html">← 管理一覧に戻る</a></header><main class="wrap"><section class="hero"><h1>８LABOの活動を登録</h1><p>チーム指導、園・学校、企業・団体、測定会などを管理します。公開範囲は「スタッフのみ」を標準とし、必要な場合だけ変更できます。</p></section><div id="status" class="status">権限を確認しています…</div><section id="app" class="grid hidden"><div class="card"><h2>活動を登録</h2><div class="field"><label>活動名</label><input id="title" placeholder="○○スポーツ少年団 出張指導"></div><div class="row2"><div class="field"><label>活動区分</label><select id="type"><option value="team">出張・チーム指導</option><option value="school">園・学校</option><option value="corporate">企業・団体</option><option value="event">イベント</option><option value="measurement">測定会</option><option value="meeting">研修・会議</option><option value="other">その他</option></select></div><div class="field"><label>実施先</label><input id="client"></div></div><div class="field"><label>日付</label><input id="date" type="date"></div><div class="row2"><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>終了</label><input id="end" type="time"></div></div><div class="field"><label>会場</label><input id="venue"></div><div class="field"><label>住所</label><input id="address"></div><div class="row2"><div class="field"><label>必要スタッフ目安</label><input id="count" type="number" min="0" value="1"></div><div class="field"><label>公開範囲</label><select id="visibility"><option value="staff" selected>スタッフのみ</option><option value="public">一般公開</option><option value="targeted">対象者のみ</option></select></div></div><div class="field"><label>備考</label><textarea id="notes" rows="4"></textarea></div><button id="save" class="save">登録する</button></div><div class="card"><h2>登録済みの活動</h2><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);const labels={team:'出張・チーム指導',school:'園・学校',corporate:'企業・団体',event:'イベント',measurement:'測定会',meeting:'研修・会議',other:'その他'},vis={staff:'スタッフのみ',public:'一般公開',targeted:'対象者のみ'};async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='ログインが必要です。';const{data:admin}=await sb.rpc('is_system_admin');let ok=!!admin;if(!ok){const{data:ss}=await sb.from('services').select('id');for(const s of ss||[]){const{data:x}=await sb.rpc('can_manage_shifts',{target_service_id:s.id});if(x){ok=true;break}}}if(!ok)return $('status').textContent='活動を管理する権限がありません。';$('app').classList.remove('hidden');$('status').textContent='登録した活動は８LABOスケジュール管理へ自動反映されます。';await load()}async function load(){const{data,error}=await sb.from('labo_activities').select('*').order('activity_date',{ascending:false}).limit(100);if(error)return $('list').textContent=error.message;$('list').innerHTML=(data||[]).map(x=>`<div class="item"><b>${x.activity_date}｜${x.title}</b><span class="badge ${x.visibility}">${vis[x.visibility]}</span><div class="meta">${labels[x.activity_type]||'その他'}${x.client_name?'｜'+x.client_name:''}<br>${(x.start_time||'').slice(0,5)}${x.end_time?'〜'+x.end_time.slice(0,5):''}${x.venue?'｜'+x.venue:''}</div></div>`).join('')||'<div class="meta">まだ活動はありません。</div>'} $('save').onclick=async()=>{if(!$('title').value||!$('date').value)return alert('活動名と日付は必須です。');const{data:{session}}=await sb.auth.getSession();const row={title:$('title').value,activity_type:$('type').value,client_name:$('client').value||null,activity_date:$('date').value,start_time:$('start').value||null,end_time:$('end').value||null,venue:$('venue').value||null,venue_address:$('address').value||null,required_staff:+$('count').value||0,visibility:$('visibility').value,notes:$('notes').value||null,status:'scheduled',created_by:session.user.id};const{error}=await sb.from('labo_activities').insert(row);if(error)return alert(error.message);['title','client','date','start','end','venue','address','notes'].forEach(i=>$(i).value='');$('visibility').value='staff';$('count').value=1;await load();alert('登録しました。スケジュール管理にも反映されます。')};boot();</script></body></html>
