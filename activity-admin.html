<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 活動管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1050px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:25px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:390px 1fr;gap:15px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px}.card h2{font-size:16px;margin:0 0 14px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:850;color:#596579;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e0e7;border-radius:10px;background:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{border:0;border-radius:11px;background:#111827;color:#fff;padding:11px 14px;font-weight:900}.status,.meta{font-size:11px;color:#64748b}.tabs{display:flex;gap:7px;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:10px;font-size:10px;font-weight:850;color:#64748b}.tabs button.on{background:#111827;color:#fff;border-color:#111827}.pane{display:none}.pane.on{display:block}.item{padding:12px 0;border-top:1px solid #eef1f4}.item b{font-size:13px}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2f6;font-size:8px;font-weight:900;margin-left:5px}.targeted{background:#eef5fb;color:#285c83}.public{background:#eaf7ef;color:#17633e}.targetbox{border:1px solid #d9e0e7;border-radius:12px;padding:11px;background:#f8fafc}.targetlist{max-height:190px;overflow:auto;margin-top:8px}.target{display:flex;align-items:center;gap:8px;padding:7px;border-top:1px solid #e8edf2;font-size:11px}.target input{width:auto}.hidden{display:none!important}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.filters input,.filters select{padding:8px;border:1px solid var(--line);border-radius:9px}@media(max-width:760px){.grid,.row2,.filters{grid-template-columns:1fr}}</style></head><body><header><div class="brand">８LABO 活動管理<small>会員サービス外の活動</small></div><a href="staff.html">← 管理一覧に戻る</a></header><main class="wrap"><section class="hero"><h1>８LABOの活動を登録</h1><p>チーム指導、園・学校、企業・団体、測定会などを管理します。</p></section><div id="status" class="status">権限を確認しています…</div><section id="app" class="grid hidden"><div class="card"><h2>活動を登録</h2><div class="field"><label>活動名</label><input id="title"></div><div class="row2"><div class="field"><label>活動区分</label><select id="type"><option value="team">出張・チーム指導</option><option value="school">園・学校</option><option value="corporate">企業・団体</option><option value="event">イベント</option><option value="measurement">測定会</option><option value="meeting">研修・会議</option><option value="other">その他</option></select></div><div class="field"><label>実施先</label><input id="client"></div></div><div class="field"><label>日付</label><input id="date" type="date"></div><div class="row2"><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>終了</label><input id="end" type="time"></div></div><div class="field"><label>会場</label><input id="venue"></div><div class="field"><label>住所</label><input id="address"></div><div class="row2"><div class="field"><label>必要スタッフ目安</label><input id="count" type="number" min="0" value="1"></div><div class="field"><label>公開範囲</label><select id="visibility"><option value="staff">スタッフのみ</option><option value="public">一般公開</option><option value="targeted">対象者のみ</option></select></div></div><div id="targetBox" class="field targetbox hidden"><label>公開対象を選択</label><input id="targetSearch" placeholder="氏名・８LABO IDで検索"><div class="meta">選択した本人に公開します。「保護者も含める」をONにすると、その人物に紐づく保護者も対象に追加します。</div><label style="margin-top:8px"><input id="includeGuardians" type="checkbox" style="width:auto"> 保護者も含める</label><div id="targetList" class="targetlist"></div></div><div class="field"><label>備考</label><textarea id="notes" rows="4"></textarea></div><button id="save" class="save">登録する</button></div><div class="card"><div class="tabs"><button class="on" data-pane="upcoming">今後の予定</button><button data-pane="history">活動履歴</button></div><section id="upcoming" class="pane on"><h2>今後の予定</h2><div id="upcomingList"></div></section><section id="history" class="pane"><h2>活動履歴</h2><div id="historyList"></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x);let activities=[],people=[];const vis={staff:'スタッフのみ',public:'一般公開',targeted:'対象者のみ'};document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.pane))});$('visibility').onchange=()=>{$('targetBox').classList.toggle('hidden',$('visibility').value!=='targeted');renderPeople()};$('targetSearch').oninput=renderPeople;function renderPeople(){const q=$('targetSearch').value.toLowerCase();$('targetList').innerHTML=people.filter(p=>!q||(`${p.last_name}${p.first_name} ${p.labo_id}`).toLowerCase().includes(q)).map(p=>`<label class="target"><input type="checkbox" class="targetPerson" value="${p.id}"><span><b>${p.last_name} ${p.first_name}</b>｜ID ${String(p.labo_id).padStart(4,'0')}</span></label>`).join('')}function item(x){return `<div class="item"><b>${x.activity_date}｜${x.title}</b><span class="badge ${x.visibility}">${vis[x.visibility]}</span><div class="meta">${(x.start_time||'').slice(0,5)}${x.end_time?'〜'+x.end_time.slice(0,5):''}${x.venue?'｜'+x.venue:''}</div></div>`}function render(){const d=new Date().toISOString().slice(0,10);$('upcomingList').innerHTML=activities.filter(x=>x.activity_date>=d&&x.status!=='cancelled').sort((a,b)=>a.activity_date.localeCompare(b.activity_date)).map(item).join('')||'<div class="meta">今後の予定はありません。</div>';$('historyList').innerHTML=activities.filter(x=>x.activity_date<d&&x.status!=='cancelled').sort((a,b)=>b.activity_date.localeCompare(a.activity_date)).map(item).join('')||'<div class="meta">履歴はありません。</div>'}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='ログインが必要です。';const{data:admin}=await sb.rpc('is_system_admin');if(!admin)return $('status').textContent='活動を管理する権限がありません。';$('app').classList.remove('hidden');$('status').textContent='対象者のみを選択した場合は、公開する人物を指定できます。';const{data:ps}=await sb.from('persons').select('id,labo_id,last_name,first_name').eq('status','active').order('labo_id');people=ps||[];renderPeople();await load()}async function load(){const{data}=await sb.from('labo_activities').select('*').order('activity_date',{ascending:false});activities=data||[];render()}$('save').onclick=async()=>{if(!$('title').value||!$('date').value)return alert('活動名と日付は必須です。');let ids=[...document.querySelectorAll('.targetPerson:checked')].map(x=>x.value);if($('visibility').value==='targeted'&&!ids.length)return alert('公開対象を1人以上選択してください。');if($('visibility').value==='targeted'&&$('includeGuardians').checked){const{data:rels}=await sb.from('person_relationships').select('from_person_id,to_person_id,relationship_type,status').in('to_person_id',ids).eq('status','active');for(const r of rels||[])if(r.relationship_type==='guardian'&&!ids.includes(r.from_person_id))ids.push(r.from_person_id)}const{data:{session}}=await sb.auth.getSession();const row={title:$('title').value,activity_type:$('type').value,client_name:$('client').value||null,activity_date:$('date').value,start_time:$('start').value||null,end_time:$('end').value||null,venue:$('venue').value||null,venue_address:$('address').value||null,required_staff:+$('count').value||0,visibility:$('visibility').value,notes:$('notes').value||null,status:'scheduled',created_by:session.user.id};const{data:a,error}=await sb.from('labo_activities').insert(row).select('id').single();if(error)return alert(error.message);if(row.visibility==='targeted'){const targets=ids.map(id=>({activity_id:a.id,person_id:id,target_role:'person'}));const{error:e}=await sb.from('labo_activity_targets').insert(targets);if(e)return alert('活動は登録されましたが対象者保存に失敗しました：'+e.message)}['title','client','date','start','end','venue','address','notes','targetSearch'].forEach(i=>$(i).value='');$('visibility').value='staff';$('targetBox').classList.add('hidden');$('includeGuardians').checked=false;$('count').value=1;await load();alert('登録しました。')};boot();</script></body></html>
