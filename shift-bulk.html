<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 教室別シフト一括登録</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#0b4f8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1040px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.14em}.back{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1040px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:24px;padding:25px}.hero h1{font-size:25px;margin:0 0 7px}.hero p{font-size:12px;line-height:1.7;color:#cbd5e1;margin:0}.status,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.status{margin:15px 0;padding:12px 14px;font-size:11px;color:#4b5563}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 5px}.sub{font-size:11px;color:var(--muted);line-height:1.65;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#596273;margin-bottom:5px}.field select,.field input{width:100%;border:1px solid #d7dde5;border-radius:11px;padding:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer}.primary{background:#111827;color:#fff}.light{background:#f3f4f6;color:#374151}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calHead button{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week span{text-align:center;font-size:10px;color:#8b95a5}.day{min-height:58px;border:1px solid #e4e9ef;border-radius:11px;background:#fafbfc;padding:7px;text-align:left;cursor:pointer}.day.off{opacity:.28}.day.selected{background:#eaf2f9;border-color:var(--blue);color:var(--blue);font-weight:900}.day.exists{box-shadow:inset 0 -4px #f0bc58}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}.selectedText{margin-top:10px;font-size:11px;color:#5f6d80;line-height:1.7}.notice{margin-top:12px;background:#f8fafc;border-radius:12px;padding:11px;font-size:10px;color:#6b7280;line-height:1.65}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.top{padding:0 14px}}</style></head><body><header class="top"><div class="brand">８LABO シフト管理<small>教室別一括登録</small></div><a class="back" href="shift.html">← シフト管理に戻る</a></header><main class="wrap"><section class="hero"><h1>教室ごとに、1か月分のシフトをまとめて作成</h1><p>ACADEMYの教室情報から曜日・時間・会場を読み込み、開催日をカレンダーで選択して一括登録します。</p></section><div id="status" class="status">権限を確認しています…</div><section id="app" style="display:none"><div class="grid"><section class="card"><h2>教室設定</h2><p class="sub">教室を選ぶと、登録済みの曜日・時間・会場を自動入力します。</p><div class="field"><label>教室</label><select id="classSelect"></select></div><div class="row"><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>終了</label><input id="end" type="time"></div></div><div class="row"><div class="field"><label>必要人数</label><input id="count" type="number" min="1" value="1"></div><div class="field"><label>場所</label><input id="location"></div></div><div class="field"><label>タイトル</label><input id="title"></div><button id="selectWeekday" class="btn light">この教室の曜日を一括選択</button> <button id="clearDates" class="btn light">選択解除</button><div class="notice">黄色線のある日は、すでに同じ教室のシフトが登録されています。一括登録時は自動で重複を除外します。</div><button id="save" class="btn primary" style="margin-top:14px;width:100%">選択した日を一括登録</button></section><section class="card"><div class="calHead"><button id="prev">‹</button><h2 id="monthLabel"></h2><button id="next">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="cal"></div><div class="legend"><span><i class="dot" style="background:#eaf2f9;border:1px solid #0b4f8a"></i>選択中</span><span><i class="dot" style="background:#f0bc58"></i>登録済み</span></div><div id="selectedText" class="selectedText">開催日を選択してください。</div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let staffId=null,academyService=null,classes=[],slots=[],selected=new Set(),calDate=new Date();function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='８LABOポータルでログインしてください。';const {data:sid}=await sb.rpc('current_staff_id');if(!sid)return $('status').textContent='スタッフ権限がありません。';staffId=sid;const {data:s}=await sb.from('services').select('id,service_code,service_name').eq('service_code','ACADEMY').single();if(!s)return $('status').textContent='ACADEMYサービス情報を取得できません。';academyService=s;const {data:ok}=await sb.rpc('can_manage_shifts',{target_service_id:s.id});if(!ok)return $('status').textContent='ACADEMYのシフト管理権限がありません。';let r=await sb.from('academy_classes').select('id,class_name,venue,weekday,start_time,end_time,status').eq('status','active').order('class_name');classes=r.data||[];r=await sb.from('staff_shift_slots').select('id,academy_class_id,shift_date,status').eq('service_id',s.id).gte('shift_date',new Date(new Date().getFullYear(),new Date().getMonth()-1,1).toISOString().slice(0,10));slots=r.data||[];$('classSelect').innerHTML=classes.map(x=>`<option value="${x.id}">${x.class_name}</option>`).join('');$('app').style.display='block';$('status').textContent='教室情報を読み込みました。';fillClass();renderCal()}function currentClass(){return classes.find(x=>x.id===$('classSelect').value)}function fillClass(){const x=currentClass();if(!x)return;$('start').value=x.start_time?.slice(0,5)||'';$('end').value=x.end_time?.slice(0,5)||'';$('location').value=x.venue||'';$('title').value=`${x.class_name} 指導`;selected.clear();renderCal()}function renderCal(){const y=calDate.getFullYear(),m=calDate.getMonth();$('monthLabel').textContent=`${y}年 ${m+1}月`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cid=$('classSelect').value;let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=ymd(d),off=d.getMonth()!==m,exists=slots.some(x=>x.academy_class_id===cid&&x.shift_date===key&&x.status!=='cancelled');html+=`<button class="day ${off?'off':''} ${selected.has(key)?'selected':''} ${exists?'exists':''}" data-day="${key}">${d.getDate()}</button>`}$('calendar').innerHTML=html;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.day)?selected.delete(b.dataset.day):selected.add(b.dataset.day);renderCal()});$('selectedText').textContent=selected.size?`選択中：${[...selected].sort().join('、')}（${selected.size}日）`:'開催日を選択してください。'}$('classSelect').onchange=fillClass;$('prev').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);selected.clear();renderCal()};$('next').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);selected.clear();renderCal()};$('clearDates').onclick=()=>{selected.clear();renderCal()};$('selectWeekday').onclick=()=>{const x=currentClass();if(!x||x.weekday===null||x.weekday===undefined)return alert('この教室には曜日が登録されていません。');selected.clear();const y=calDate.getFullYear(),m=calDate.getMonth(),last=new Date(y,m+1,0).getDate();for(let d=1;d<=last;d++){const dt=new Date(y,m,d);if(dt.getDay()===Number(x.weekday))selected.add(ymd(dt))}renderCal()};$('save').onclick=async()=>{const x=currentClass();if(!x||!selected.size)return alert('教室と開催日を選択してください。');const existing=new Set(slots.filter(s=>s.academy_class_id===x.id&&s.status!=='cancelled').map(s=>s.shift_date));const dates=[...selected].filter(d=>!existing.has(d));const skip=selected.size-dates.length;if(!dates.length)return alert('選択した日はすべて登録済みです。');const rows=dates.map(d=>({service_id:academyService.id,academy_class_id:x.id,title:$('title').value.trim()||`${x.class_name} 指導`,shift_date:d,start_time:$('start').value||null,end_time:$('end').value||null,location:$('location').value||null,required_count:+$('count').value||1,status:'open',created_by:staffId}));const {error}=await sb.from('staff_shift_slots').insert(rows);if(error)return alert(error.message);alert(`${rows.length}件登録しました。${skip?` ${skip}件は重複のため除外しました。`:''}`);selected.clear();const r=await sb.from('staff_shift_slots').select('id,academy_class_id,shift_date,status').eq('service_id',academyService.id);slots=r.data||[];renderCal()};boot();</script></body></html>
