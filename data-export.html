<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ書き出し｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1100px)/2))}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:25px}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:900;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.card h2{font-size:15px;margin:0 0 4px}.sub{font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #eef1f4}.row:first-of-type{border-top:0}.row b{font-size:11px}.row small{display:block;color:#8a94a3;font-size:8px;margin-top:2px}.status{margin:14px 0;padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:10px}.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;font-size:10px;color:#64748b;line-height:1.7}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>８LABO データ書き出し</b><a href="portal-admin.html">← ポータル管理へ</a></header><main class="wrap"><section class="hero"><h1>全データを書き出す</h1><p>人物・サービス・活動・シフト・測定・お知らせ・個別メッセージ・変更履歴まで、管理データを保存できます。</p></section><div id="status" class="status">管理者権限を確認しています…</div><section id="app" class="hidden"><div class="actions"><button id="allCsv" class="btn primary">全データをCSV（ZIP）で保存</button><button id="allJson" class="btn">全データをJSONで保存</button><a class="btn" href="admin.html">インポート画面へ</a></div><div id="groups" class="grid"></div><div class="note">CSVの見出しは「日本語（内部項目名）」を基本とします。例：<b>８LABO ID（labo_id）</b>。データベース内部では英語コードを維持し、画面表示と書き出し値は可能な限り日本語化します。パスワードそのものはシステム上保存・取得できないため、書き出し対象には含みません。</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);const groups=[['人物・ID',[['persons','人物'],['person_id_aliases','旧ID・統合ID'],['person_relationships','家族・関係'],['user_accounts','ログインアカウント']]],['サービス・スタッフ',[['services','サービス'],['service_memberships','サービス利用'],['staff_users','スタッフ'],['staff_roles','権限定義'],['staff_role_assignments','スタッフ権限']]],['ACADEMY・活動',[['academy_classes','ACADEMY教室'],['academy_class_members','ACADEMY所属'],['academy_schedule','ACADEMY予定'],['labo_activities','８LABO活動'],['labo_activity_targets','活動公開対象']]],['BizFit',[['bizfit_events','BizFitイベント'],['bizfit_registrations','BizFit参加申込'],['bizfit_activity_records','BizFit活動記録']]],['シフト',[['staff_shift_slots','シフト枠'],['staff_shift_responses','シフト回答'],['staff_shift_response_history','シフト回答変更履歴'],['staff_shift_assignments','確定シフト・担当'],['staff_shift_assignment_history','シフト配置・交代変更履歴']]],['測定・同意',[['assessment_items','測定項目'],['assessment_sessions','測定会・測定セッション'],['assessment_results','測定結果'],['consent_definitions','同意項目'],['person_consents','同意記録']]],['お知らせ・メッセージ',[['academy_notices','ACADEMYお知らせ'],['academy_notice_acknowledgements','ACADEMY確認履歴'],['academy_push_deliveries','ACADEMY通知配信履歴'],['bizfit_notices','BizFitお知らせ'],['bizfit_notice_reads','BizFit既読履歴'],['bizfit_personal_messages','BizFit個別メッセージ'],['bizfit_personal_message_reads','BizFit個別メッセージ既読']]],['管理履歴',[['admin_change_log','管理者変更履歴']]]];const jp={id:'内部ID',labo_id:'８LABO ID',person_id:'人物ID',last_name:'姓',first_name:'名',last_name_kana:'姓カナ',first_name_kana:'名カナ',birth_date:'生年月日',gender:'性別',phone:'電話番号',email:'メールアドレス',status:'状態',notes:'備考',created_at:'作成日時',updated_at:'更新日時',service_id:'サービスID',service_code:'サービスコード',service_name:'サービス名',membership_status:'利用状態',applied_at:'申込日',started_at:'開始日',ended_at:'終了日',staff_user_id:'スタッフID',staff_status:'スタッフ状態',role_code:'権限コード',role_name:'権限名',shift_slot_id:'シフト枠ID',shift_date:'日付',start_time:'開始時刻',end_time:'終了時刻',participant_start_time:'参加者開始時刻',participant_end_time:'参加者終了時刻',before_minutes:'集合前分',after_minutes:'解散後分',required_count:'必要人数',title:'名称',location:'場所',response_status:'回答',comment:'コメント',old_response_status:'変更前回答',new_response_status:'変更後回答',assignment_status:'配置状態',role_name:'担当役割',old_assignment_status:'変更前配置状態',new_assignment_status:'変更後配置状態',old_role_name:'変更前役割',new_role_name:'変更後役割',old_notes:'変更前内容',new_notes:'変更後内容',changed_at:'変更日時',changed_by:'変更者',assigned_at:'確定日時',assigned_by:'確定者',assessment_date:'測定日',numeric_value:'数値結果',text_value:'文字結果',boolean_value:'判定結果',message:'メッセージ',body:'本文',subject:'件名',published_at:'公開日時',read_at:'既読日時'};const valmap={active:'有効',inactive:'停止',archived:'保管済み',open:'回答受付中',draft:'準備中',confirmed:'確定',cancelled:'取消',assigned:'確定',preferred:'できれば入りたい',available:'勤務可能',unavailable:'勤務不可',undecided:'未回答',pending_target:'交代相手の回答待ち',target_approved:'交代相手承認済み',target_rejected:'交代相手却下',application:'申込中',trial:'体験',paused:'休止中',withdrawn:'退会',completed:'完了',inquiry:'問い合わせ',staff:'スタッフのみ',public:'一般公開',targeted:'対象者のみ',guardian:'保護者'};function header(k){return (jp[k]||k)+'（'+k+'）'}function value(v){if(v===null||v===undefined)return '';if(typeof v==='boolean')return v?'はい':'いいえ';if(typeof v==='object')return JSON.stringify(v);return valmap[v]||v}function esc(v){let s=String(value(v));return /[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}function csv(rows){if(!rows.length)return '\ufeff';let keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];return '\ufeff'+[keys.map(header).join(','),...rows.map(r=>keys.map(k=>esc(r[k])).join(','))].join('\n')}async function get(t){let{data,error}=await sb.rpc('admin_export_dataset',{p_dataset:t});if(error)throw error;return data||[]}function dl(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function render(){groups.forEach(([g,items])=>{$('groups').insertAdjacentHTML('beforeend',`<section class="card"><h2>${g}</h2><div class="sub">必要なデータだけ個別にCSV保存できます。</div>${items.map(([t,n])=>`<div class="row"><div><b>${n}</b><small>${t}</small></div><button class="btn" data-table="${t}" data-name="${n}">CSV</button></div>`).join('')}</section>`)});document.querySelectorAll('[data-table]').forEach(b=>b.onclick=async()=>{try{$('status').textContent=b.dataset.name+'を準備しています…';let r=await get(b.dataset.table);dl('8labo_'+b.dataset.table+'_'+new Date().toISOString().slice(0,10)+'.csv',new Blob([csv(r)],{type:'text/csv;charset=utf-8'}));$('status').textContent=b.dataset.name+'を書き出しました。'}catch(e){$('status').textContent='書き出せませんでした：'+e.message}})}async function boot(){let{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='ログインしてください。';let{data:ok}=await sb.rpc('is_system_admin');if(!ok)return $('status').textContent='全体管理者のみ利用できます。';$('status').textContent='全体管理者として接続しています。';$('app').classList.remove('hidden');render()}$('allCsv').onclick=async()=>{try{$('status').textContent='全データを準備しています…';let z=new JSZip();for(let[,items]of groups)for(let[t]of items)z.file(t+'.csv',csv(await get(t)));let b=await z.generateAsync({type:'blob'});dl('8labo_all_data_'+new Date().toISOString().slice(0,10)+'.zip',b);$('status').textContent='全データCSVを書き出しました。'}catch(e){$('status').textContent='書き出せませんでした：'+e.message}};$('allJson').onclick=async()=>{try{$('status').textContent='全データを準備しています…';let o={format:'8labo-full-export-v2',exported_at:new Date().toISOString(),tables:{}};for(let[,items]of groups)for(let[t]of items)o.tables[t]=await get(t);dl('8labo_all_data_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));$('status').textContent='全データJSONを書き出しました。'}catch(e){$('status').textContent='書き出せませんでした：'+e.message}};boot();</script></body></html>
