<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 管理ポータル</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{width:min(760px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:19px;font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.16em;color:var(--muted);margin-top:3px}.back{font-size:11px;color:#6b7280;text-decoration:none}.notice,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.notice{padding:15px 16px;font-size:12px;color:#4b5563;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.card{padding:20px;text-decoration:none;color:inherit;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.card.disabled{opacity:.34;pointer-events:none}.tag{font-size:9px;font-weight:900;letter-spacing:.12em;color:#9ca3af}.card h2{font-size:19px;margin:8px 0 6px}.card p{font-size:11px;color:#6b7280;line-height:1.65;margin:0}.go{align-self:flex-end;margin-top:18px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff}.status{margin-top:18px;font-size:10px;color:#9ca3af}.hidden{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">８LABO 管理<small>STAFF PORTAL</small></div><a class="back" href="./">← ポータルへ戻る</a></div><div id="notice" class="notice">スタッフ権限を確認しています…</div><section id="grid" class="grid hidden"><a id="common" class="card disabled" href="admin.html"><div><div class="tag">COMMON</div><h2>８LABO 共通管理</h2><p>人物・家族・サービス利用・測定データ・インポート／エクスポートなどの共通基盤。</p></div><div class="go">→</div></a><a id="academy" class="card disabled" href="https://8labo.github.io/8labo-academy.app.demo2/admin-access.html"><div><div class="tag">SERVICE</div><h2>ACADEMY 管理</h2><p>教室、会員、出欠、振替、カルテなどACADEMY固有の管理。</p></div><div class="go">→</div></a><a id="bizfit" class="card disabled" href="https://8labo.github.io/bizfit-club.app.demo2/admin.html"><div><div class="tag">SERVICE</div><h2>BizFitクラブ 管理</h2><p>イベント、参加者、活動記録などBizFit固有の管理。</p></div><div class="go">→</div></a></section><div id="status" class="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const cfg=window.EIGHTLABO_CONFIG,sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);const $=id=>document.getElementById(id);async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('notice').textContent='ログインが必要です。共通ポータルからログインしてください。';return}const {data:staffId,error:staffErr}=await sb.rpc('current_staff_id');if(staffErr||!staffId){$('notice').textContent='このページを利用できるスタッフ権限がありません。';return}$('grid').classList.remove('hidden');$('notice').textContent='利用可能な管理画面だけ開けます。';const {data:isAdmin}=await sb.rpc('is_system_admin');if(isAdmin)$('common').classList.remove('disabled');const {data:services}=await sb.from('services').select('id,service_code').in('service_code',['ACADEMY','BIZFIT']);for(const s of services||[]){const {data:ok}=await sb.rpc('has_service_access',{target_service_id:s.id});if(ok&&s.service_code==='ACADEMY')$('academy').classList.remove('disabled');if(ok&&s.service_code==='BIZFIT')$('bizfit').classList.remove('disabled')}$('status').textContent='Supabaseのスタッフロール・担当サービスに基づいてアクセスを制御しています。'}boot();</script></body></html>
