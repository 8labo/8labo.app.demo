<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員表示プレビュー｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.preview{background:#fff4d8;border-bottom:1px solid #efd89a;padding:10px 16px;text-align:center;font-size:11px;font-weight:800;position:sticky;top:0;z-index:10}.preview button{margin-left:10px;border:0;background:#111827;color:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.head{background:#111827;color:#fff;border-radius:22px;padding:24px}.head small{color:#cbd5e1}.head h1{margin:5px 0;font-size:25px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:13px}.card h2{font-size:15px;margin:0 0 12px}.service{border-top:1px solid #eef1f4;padding:13px 0;display:flex;justify-content:space-between;gap:10px}.service:first-of-type{border-top:0}.badge{font-size:9px;padding:5px 8px;border-radius:999px;background:#eef8f3;font-weight:900}.child{padding:10px 0;border-top:1px solid #eef1f4}.muted{font-size:11px;color:var(--muted);line-height:1.7}.disabled{opacity:.45}.notice{background:#f8fafc;border-radius:12px;padding:11px;font-size:10px;color:#64748b}.hidden{display:none}</style></head><body><div class="preview">管理者プレビューモード｜閲覧のみ <button onclick="location.href='portal-admin.html'">プレビュー終了</button></div><main class="wrap"><div id="status" class="card">表示情報を確認しています…</div><section id="app" class="hidden"><div class="head"><small>８LABO PORTAL</small><h1 id="name"></h1><small id="id"></small></div><div class="card"><h2>利用中のサービス</h2><div id="services"></div></div><div class="card"><h2>家族・お子さま</h2><div id="children"></div></div><div class="card"><h2>このプレビューについて</h2><div class="notice">会員本人のパスワードではログインしていません。管理者権限で、その会員に紐づく情報から「会員側に表示されるべき内容」を再現しています。欠席連絡・申込・プロフィール変更などの更新操作は無効です。</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){const person=new URLSearchParams(location.search).get('person');if(!person)return $('status').textContent='対象会員が指定されていません。';const{data:{session}}=await sb.auth.getSession();if(!session)return $('status').textContent='管理者としてログインしてください。';const{data,error}=await sb.rpc('admin_member_preview',{target_person_id:person});if(error||!data)return $('status').textContent='プレビューを表示できません：'+(error?.message||'対象者が見つかりません');$('status').classList.add('hidden');$('app').classList.remove('hidden');$('name').textContent=data.person.last_name+' '+data.person.first_name;$('id').textContent='８LABO ID '+String(data.person.labo_id).padStart(4,'0');const active=(data.memberships||[]).filter(x=>['active','trial','application'].includes(x.membership_status));$('services').innerHTML=active.length?active.map(x=>`<div class="service"><div><b>${esc(x.service_name)}</b><div class="muted">会員ページでは、このサービスへの入口が表示されます。</div></div><span class="badge">${x.membership_status==='active'?'利用中':x.membership_status==='trial'?'体験':'申込中'}</span></div>`).join(''):'<div class="muted">現在表示対象のサービスはありません。</div>';$('children').innerHTML=(data.children||[]).length?data.children.map(x=>`<div class="child"><b>${esc(x.last_name)} ${esc(x.first_name)}</b><div class="muted">８LABO ID ${String(x.labo_id).padStart(4,'0')}</div></div>`).join(''):'<div class="muted">表示対象のお子さまはいません。</div>'}boot();</script></body></html>
