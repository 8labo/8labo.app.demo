<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO ポータル管理</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#0b4f8a;--green:#18794e;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:10}.brand{font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted)}.back{font-size:11px;text-decoration:none;color:#6b7280}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:24px;padding:25px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.status{padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:11px;color:#4b5563;margin-bottom:15px}.status.ok{background:#f0fdf4;color:#166534}.status.err{background:#fef2f2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{font-size:23px;display:block}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:11px 12px}.toolbar a{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:#374151;text-decoration:none;font-size:11px;font-weight:800}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card{padding:18px}.card h2{margin:0 0 5px;font-size:17px}.sub{font-size:11px;color:var(--muted);margin:0 0 14px;line-height:1.6}.people{max-height:690px;overflow:auto}.person{display:flex;align-items:center;gap:11px;padding:12px 4px;border-top:1px solid #eef1f4;cursor:pointer}.person:first-child{border-top:0}.person:hover{background:#fafbfc}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eef2f7;font-weight:900;color:#475569}.personMain{flex:1;min-width:0}.personMain b{font-size:13px;display:block}.meta{font-size:9px;color:#8a94a3;margin-top:3px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chip{display:inline-flex;border-radius:999px;padding:4px 7px;background:#f3f4f6;color:#4b5563;font-size:8px;font-weight:900}.chip.staff{background:#eef5fb;color:#315f84}.chip.service{background:#eef8f3;color:#287b56}.chip.warn{background:#fff4e5;color:#a86400}.empty{font-size:12px;color:#9ca3af;padding:18px 0}.detailHead{display:flex;justify-content:space-between;align-items:start;gap:12px}.detailHead h2{font-size:20px}.id{font-size:10px;color:#6b7280;margin-top:4px}.section{padding-top:15px;margin-top:15px;border-top:1px solid #edf0f2}.section h3{font-size:12px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}.field label{display:block;font-size:9px;color:#6b7280;font-weight:800;margin:0 0 5px}.field select{width:100%;border:1px solid #d7dde5;border-radius:10px;padding:9px;background:#fff}.serviceRow,.roleRow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #f0f2f4}.serviceRow:first-child,.roleRow:first-child{border-top:0}.serviceRow b,.roleRow b{font-size:11px}.switch{display:flex;gap:6px}.btn{border:0;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#111827;color:#fff}.light{background:#f3f4f6;color:#374151}.blue{background:#0b4f8a;color:#fff}.danger{background:#fff0f0;color:#a33;border:1px solid #efcaca}.notice{font-size:10px;line-height:1.65;color:#7c8797;background:#f8fafc;border-radius:12px;padding:10px}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.people{max-height:none}.toolbar{align-items:stretch;flex-direction:column}.toolbar input,.toolbar a{width:100%}}
</style></head><body><header class="top"><div class="brand">８LABO ポータル管理<small>COMMON PLATFORM ADMIN</small></div><a class="back" href="staff.html">← 管理ポータルへ</a></header><main class="wrap"><section class="hero"><h1>人物・アカウント・権限を一元管理</h1><p>８LABO IDは1人1つ。サービス利用、保護者などの立場、ログイン状態、スタッフ権限を別レイヤーで管理します。</p></section><div id="status" class="status">管理者権限を確認しています…</div><section id="app" class="hidden"><div class="stats"><div class="stat"><b id="statPeople">–</b><span>人物</span></div><div class="stat"><b id="statAccounts">–</b><span>ログインアカウント</span></div><div class="stat"><b id="statStaff">–</b><span>スタッフ</span></div><div class="stat"><b id="statMemberships">–</b><span>サービス利用登録</span></div></div><div class="toolbar"><input id="search" placeholder="氏名・８LABO IDで検索"><a href="admin.html">データ入出力</a></div><div class="layout"><section class="card"><h2>人物一覧</h2><p class="sub">「会員」「スタッフ」を別人物にはせず、1つの８LABO IDに複数の立場を重ねて管理します。</p><div id="people" class="people"></div></section><section class="card"><div id="detail"><div class="empty">人物を選択してください。</div></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.EIGHTLABO_CONFIG,sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=id=>document.getElementById(id);let people=[],accounts=[],staffUsers=[],assignments=[],roles=[],services=[],memberships=[],relationships=[],selected=null;const fmt=n=>String(n).padStart(4,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return fail('共通ポータルでログインしてください。');const {data:isAdmin,error}=await sb.rpc('is_system_admin');if(error||!isAdmin)return fail('SYSTEM_ADMIN権限が必要です。');$('status').textContent='SYSTEM_ADMINとして接続しました。';$('status').className='status ok';$('app').classList.remove('hidden');await loadAll()}
function fail(t){$('status').textContent=t;$('status').className='status err'}
async function loadAll(){let r=await sb.from('persons').select('id,labo_id,last_name,first_name,status,email,phone').order('labo_id');people=r.data||[];r=await sb.from('user_accounts').select('id,auth_user_id,person_id,account_status');accounts=r.data||[];r=await sb.from('staff_users').select('id,person_id,auth_user_id,staff_status');staffUsers=r.data||[];r=await sb.from('staff_roles').select('id,role_code,role_name');roles=r.data||[];r=await sb.from('staff_role_assignments').select('id,staff_user_id,role_id,service_id,status');assignments=r.data||[];r=await sb.from('services').select('id,service_code,service_name').order('service_code');services=r.data||[];r=await sb.from('service_memberships').select('id,person_id,service_id,membership_status');memberships=r.data||[];r=await sb.from('person_relationships').select('from_person_id,to_person_id,relationship_type,status');relationships=r.data||[];$('statPeople').textContent=people.length;$('statAccounts').textContent=accounts.filter(x=>x.account_status==='active').length;$('statStaff').textContent=staffUsers.filter(x=>x.staff_status==='active').length;$('statMemberships').textContent=memberships.length;renderPeople();if(selected){selected=people.find(x=>x.id===selected.id);if(selected)renderDetail(selected)}}
function accountFor(p){return accounts.find(x=>x.person_id===p.id)}function staffFor(p){return staffUsers.find(x=>x.person_id===p.id)}function membershipsFor(p){return memberships.filter(x=>x.person_id===p.id)}function personChips(p){const out=[];const a=accountFor(p),st=staffFor(p),ms=membershipsFor(p);if(a)out.push(`<span class="chip">ログイン${a.account_status==='active'?'':'停止中'}</span>`);if(st&&st.staff_status==='active')out.push('<span class="chip staff">スタッフ</span>');for(const m of ms){const s=services.find(x=>x.id===m.service_id);if(s)out.push(`<span class="chip service">${esc(s.service_code)}:${esc(m.membership_status)}</span>`)}const guardian=relationships.some(x=>x.from_person_id===p.id&&x.relationship_type==='guardian'&&x.status==='active');const child=relationships.some(x=>x.to_person_id===p.id&&x.relationship_type==='guardian'&&x.status==='active');if(guardian)out.push('<span class="chip">保護者</span>');if(child)out.push('<span class="chip">子ども</span>');return out.join('')}
function renderPeople(){const q=$('search').value.trim().toLowerCase();const rows=people.filter(p=>!q||`${p.last_name}${p.first_name} ${p.labo_id} ${fmt(p.labo_id)}`.toLowerCase().includes(q));$('people').innerHTML=rows.map(p=>`<div class="person" data-id="${p.id}"><div class="avatar">${esc(p.last_name.slice(0,1))}</div><div class="personMain"><b>${esc(p.last_name)} ${esc(p.first_name)}</b><div class="meta">８LABO ID ${fmt(p.labo_id)}｜${esc(p.status)}</div><div class="chips">${personChips(p)}</div></div></div>`).join('')||'<div class="empty">該当する人物がいません。</div>';document.querySelectorAll('.person').forEach(x=>x.onclick=()=>{selected=people.find(p=>p.id===x.dataset.id);renderDetail(selected)})}
function roleAssignmentsFor(p){const st=staffFor(p);if(!st)return[];return assignments.filter(x=>x.staff_user_id===st.id&&x.status==='active')}
function renderDetail(p){const a=accountFor(p),st=staffFor(p),ms=membershipsFor(p),ras=roleAssignmentsFor(p);$('detail').innerHTML=`<div class="detailHead"><div><h2>${esc(p.last_name)} ${esc(p.first_name)}</h2><div class="id">８LABO ID ${fmt(p.labo_id)}</div></div><span class="chip">${esc(p.status)}</span></div><div class="section"><h3>基本状態</h3><div class="row"><div class="field"><label>人物ステータス</label><select id="personStatus"><option value="active" ${p.status==='active'?'selected':''}>active</option><option value="inactive" ${p.status==='inactive'?'selected':''}>inactive</option><option value="archived" ${p.status==='archived'?'selected':''}>archived</option></select></div><div class="field"><label>ログイン</label><select disabled><option>${a?a.account_status:'未登録'}</option></select></div></div><button id="savePerson" class="btn primary">基本状態を保存</button></div><div class="section"><h3>サービス利用</h3><div id="serviceRows">${services.map(s=>{const m=ms.find(x=>x.service_id===s.id);return `<div class="serviceRow"><div><b>${esc(s.service_name)}</b><div class="meta">${esc(s.service_code)}</div></div><select data-service="${s.id}"><option value="none" ${!m?'selected':''}>利用なし</option>${['inquiry','application','trial','active','paused','withdrawn','completed'].map(v=>`<option value="${v}" ${m?.membership_status===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}</div><button id="saveServices" class="btn blue">サービス利用を保存</button></div><div class="section"><h3>スタッフ権限</h3>${!a?'<div class="notice">ログインアカウントがないためスタッフ権限は付与できません。まず本人用ログインを作成する設計です。</div>':`<div class="field"><label>スタッフ状態</label><select id="staffStatus"><option value="none" ${!st?'selected':''}>スタッフではない</option><option value="active" ${st?.staff_status==='active'?'selected':''}>active</option><option value="inactive" ${st?.staff_status==='inactive'?'selected':''}>inactive</option></select></div><div class="roleRow"><div><b>システム管理者</b><div class="meta">８LABO全体</div></div><select id="systemRole"><option value="none">なし</option><option value="SYSTEM_ADMIN" ${ras.some(x=>roles.find(r=>r.id===x.role_id)?.role_code==='SYSTEM_ADMIN')?'selected':''}>SYSTEM_ADMIN</option></select></div>${services.filter(s=>['ACADEMY','BIZFIT'].includes(s.service_code)).map(s=>{const ra=ras.find(x=>x.service_id===s.id);const rc=ra?roles.find(r=>r.id===ra.role_id)?.role_code:'none';return `<div class="roleRow"><div><b>${esc(s.service_name)}</b><div class="meta">サービス権限</div></div><select data-role-service="${s.id}"><option value="none">なし</option>${['SERVICE_ADMIN','SERVICE_STAFF','VIEWER'].map(v=>`<option value="${v}" ${rc===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}<button id="saveStaff" class="btn primary">スタッフ権限を保存</button>`}</div><div class="section"><div class="notice">８LABO IDは人物固有番号です。スタッフを退職してもIDは残し、スタッフ権限だけを無効化します。</div></div>`;$('savePerson').onclick=()=>savePerson(p);$('saveServices').onclick=()=>saveServices(p);if(a&&$('saveStaff'))$('saveStaff').onclick=()=>saveStaff(p,a)}
async function savePerson(p){const {error}=await sb.from('persons').update({status:$('personStatus').value,updated_at:new Date().toISOString()}).eq('id',p.id);if(error)return alert(error.message);await loadAll()}
async function saveServices(p){for(const sel of document.querySelectorAll('[data-service]')){const serviceId=sel.dataset.service,val=sel.value,existing=memberships.find(x=>x.person_id===p.id&&x.service_id===serviceId);if(val==='none'&&existing){const {error}=await sb.from('service_memberships').delete().eq('id',existing.id);if(error)return alert(error.message)}else if(val!=='none'){if(existing){const {error}=await sb.from('service_memberships').update({membership_status:val,updated_at:new Date().toISOString()}).eq('id',existing.id);if(error)return alert(error.message)}else{const {error}=await sb.from('service_memberships').insert({person_id:p.id,service_id:serviceId,membership_status:val});if(error)return alert(error.message)}}}await loadAll()}
async function ensureStaff(p,a){let st=staffFor(p);const val=$('staffStatus').value;if(val==='none'){if(st){await sb.from('staff_role_assignments').update({status:'inactive',updated_at:new Date().toISOString()}).eq('staff_user_id',st.id);await sb.from('staff_users').update({staff_status:'inactive',updated_at:new Date().toISOString()}).eq('id',st.id)}return null}if(!st){const {data,error}=await sb.from('staff_users').insert({person_id:p.id,auth_user_id:a.auth_user_id,staff_status:val}).select('id,person_id,auth_user_id,staff_status').single();if(error)throw error;st=data}else{const {error}=await sb.from('staff_users').update({staff_status:val,updated_at:new Date().toISOString()}).eq('id',st.id);if(error)throw error}return st}
async function setRole(st,roleCode,serviceId){const relevant=assignments.filter(x=>x.staff_user_id===st.id&&x.service_id===serviceId);for(const x of relevant){if(x.status==='active')await sb.from('staff_role_assignments').update({status:'inactive',updated_at:new Date().toISOString()}).eq('id',x.id)}if(roleCode==='none')return;const role=roles.find(r=>r.role_code===roleCode);if(!role)return;const old=relevant.find(x=>x.role_id===role.id);if(old){await sb.from('staff_role_assignments').update({status:'active',updated_at:new Date().toISOString()}).eq('id',old.id)}else{await sb.from('staff_role_assignments').insert({staff_user_id:st.id,role_id:role.id,service_id:serviceId,status:'active'})}}
async function saveStaff(p,a){try{const st=await ensureStaff(p,a);if(!st){await loadAll();return}await setRole(st,$('systemRole').value,null);for(const sel of document.querySelectorAll('[data-role-service]'))await setRole(st,sel.value,sel.dataset.roleService);await loadAll()}catch(e){alert(e.message)}}$('search').oninput=renderPeople;boot();
</script></body></html>
