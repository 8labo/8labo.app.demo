<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO ポータル管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}a{color:inherit;text-decoration:none}.back{font-size:11px;color:var(--muted)}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:28px}.hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#cbd5e1;font-size:12px}.status{margin:15px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;font-size:11px}.ok{background:#f0fdf4}.err{background:#fef2f2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;border:1px solid #d1d5db;border-radius:12px;padding:11px}.tool{padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:11px;font-weight:800;background:#fff}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.card{padding:18px}.card h2{margin:0 0 5px;font-size:17px}.sub{font-size:11px;color:var(--muted)}.person{display:flex;gap:10px;align-items:center;padding:12px 4px;border-top:1px solid #eef1f4;cursor:pointer}.person:hover{background:#fafbfc}.avatar{width:38px;height:38px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-weight:900}.person b{font-size:13px}.meta{font-size:9px;color:#8a94a3;margin-top:3px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.chip{font-size:8px;font-weight:900;background:#f3f4f6;border-radius:999px;padding:4px 7px}.chip.staff{background:#eef5fb}.chip.service{background:#eef8f3}.section{border-top:1px solid #edf0f2;margin-top:15px;padding-top:15px}.section h3{font-size:12px;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:10px}.field label{display:block;font-size:9px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field select,.serviceRow select,.roleRow select{width:100%;border:1px solid #d7dde5;border-radius:10px;padding:9px;background:#fff}.serviceRow,.roleRow{display:grid;grid-template-columns:1fr 145px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #f0f2f4}.btn{display:inline-block;border:0;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:900;background:#111827;color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#111827;border:1px solid var(--line)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.notice{font-size:10px;color:#7c8797;background:#f8fafc;border-radius:12px;padding:10px;line-height:1.6}.empty{font-size:12px;color:#9ca3af;padding:18px 0}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">８LABO ポータル管理<small>共通管理</small></div><a class="back" href="staff.html">← 管理メニューへ</a></header><main class="wrap"><section class="hero"><h1>人物・アカウント・権限を一元管理</h1><p>人物カルテ、会員表示プレビュー、テスト会員もここから確認できます。</p></section><div id="status" class="status">管理者権限を確認しています…</div><section id="app" class="hidden"><div class="stats"><div class="stat"><b id="nPeople">–</b><span>登録人物</span></div><div class="stat"><b id="nAccounts">–</b><span>ログイン可能</span></div><div class="stat"><b id="nStaff">–</b><span>スタッフ</span></div><div class="stat"><b id="nMemberships">–</b><span>サービス利用</span></div></div><div class="toolbar"><input id="search" placeholder="氏名・８LABO IDで検索"><a class="tool" href="test-members.html">テスト会員</a><a class="tool" href="admin.html">データの入出力</a></div><div class="layout"><section class="card"><h2>人物一覧</h2><p class="sub">人物を選ぶと右側に管理情報が表示されます。</p><div id="people"></div></section><section class="card"><div id="detail" class="empty">人物を選択してください。</div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let people=[],accounts=[],staff=[],assign=[],roles=[],services=[],members=[],rels=[],selected;const fmt=n=>String(n).padStart(4,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),state={active:'利用中',inactive:'停止中',archived:'保管済み'},memberState={inquiry:'問い合わせ',application:'申込中',trial:'体験',active:'利用中',paused:'休止中',withdrawn:'退会',completed:'完了'},roleName={SYSTEM_ADMIN:'全体管理者',SERVICE_ADMIN:'サービス管理者',SERVICE_STAFF:'サービススタッフ',VIEWER:'閲覧のみ'};async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return fail('８LABOポータルからログインしてください。');const{data:ok}=await sb.rpc('is_system_admin');if(!ok)return fail('この画面を利用できる権限がありません。');$('status').textContent='全体管理者として接続しています。';$('status').className='status ok';$('app').classList.remove('hidden');load()}function fail(t){$('status').textContent=t;$('status').className='status err'}async function load(){let r=await sb.from('persons').select('*').order('labo_id');people=r.data||[];r=await sb.from('user_accounts').select('*');accounts=r.data||[];r=await sb.from('staff_users').select('*');staff=r.data||[];r=await sb.from('staff_roles').select('*');roles=r.data||[];r=await sb.from('staff_role_assignments').select('*');assign=r.data||[];r=await sb.from('services').select('*');services=r.data||[];r=await sb.from('service_memberships').select('*');members=r.data||[];r=await sb.from('person_relationships').select('*');rels=r.data||[];$('nPeople').textContent=people.length;$('nAccounts').textContent=accounts.filter(x=>x.account_status==='active').length;$('nStaff').textContent=staff.filter(x=>x.staff_status==='active').length;$('nMemberships').textContent=members.length;renderPeople();if(selected){selected=people.find(x=>x.id===selected.id);if(selected)detail(selected)}}function chips(p){let a=[],ac=accounts.find(x=>x.person_id===p.id),st=staff.find(x=>x.person_id===p.id);if(ac)a.push(`<span class="chip">ログイン${ac.account_status==='active'?'可':'停止'}</span>`);if(st?.staff_status==='active')a.push('<span class="chip staff">スタッフ</span>');members.filter(x=>x.person_id===p.id).forEach(m=>{let s=services.find(x=>x.id===m.service_id);if(s)a.push(`<span class="chip service">${esc(s.service_name)}：${memberState[m.membership_status]||m.membership_status}</span>`)});if(rels.some(x=>x.from_person_id===p.id&&x.relationship_type==='guardian'&&x.status==='active'))a.push('<span class="chip">保護者</span>');if(rels.some(x=>x.to_person_id===p.id&&x.relationship_type==='guardian'&&x.status==='active'))a.push('<span class="chip">子ども</span>');return a.join('')}function renderPeople(){const q=$('search').value.trim();const rows=people.filter(p=>!q||`${p.last_name}${p.first_name}${p.labo_id}${fmt(p.labo_id)}`.includes(q));$('people').innerHTML=rows.map(p=>`<div class="person" data-id="${p.id}"><div class="avatar">${esc((p.last_name||'?')[0])}</div><div><b>${esc(p.last_name)} ${esc(p.first_name)}</b><div class="meta">８LABO ID ${fmt(p.labo_id)}｜${state[p.status]||p.status}</div><div class="chips">${chips(p)}</div></div></div>`).join('')||'<div class="empty">該当者はいません。</div>';document.querySelectorAll('.person').forEach(x=>x.onclick=()=>{selected=people.find(p=>p.id===x.dataset.id);detail(selected)})}function detail(p){const ac=accounts.find(x=>x.person_id===p.id),st=staff.find(x=>x.person_id===p.id),ms=members.filter(x=>x.person_id===p.id),ras=st?assign.filter(x=>x.staff_user_id===st.id&&x.status==='active'):[];$('detail').innerHTML=`<h2>${esc(p.last_name)} ${esc(p.first_name)}</h2><div class="meta">８LABO ID ${fmt(p.labo_id)}</div><div class="actions"><a class="btn" href="person-detail.html?person=${encodeURIComponent(p.id)}">人物カルテを開く</a><a class="btn ghost" href="member-preview.html?person=${encodeURIComponent(p.id)}">会員表示をプレビュー</a></div><div class="section"><h3>基本・連絡先</h3><div class="row"><div class="field"><label>人物の状態</label><select id="personStatus">${['active','inactive','archived'].map(v=>`<option value="${v}" ${p.status===v?'selected':''}>${state[v]}</option>`).join('')}</select></div><div class="field"><label>ログイン</label><select disabled><option>${ac?(ac.account_status==='active'?'利用可能':'停止中'):'未登録'}</option></select></div></div><div class="row"><div class="field"><label>電話番号</label><input value="${esc(p.phone||'')}" disabled></div><div class="field"><label>連絡先メール</label><input value="${esc(p.email||'')}" disabled></div></div><button id="savePerson" class="btn">人物状態を保存</button></div><div class="section"><h3>サービス利用</h3>${services.map(s=>{const m=ms.find(x=>x.service_id===s.id);return `<div class="serviceRow"><b>${esc(s.service_name)}</b><select data-service="${s.id}"><option value="none" ${!m?'selected':''}>利用なし</option>${Object.entries(memberState).map(([v,n])=>`<option value="${v}" ${m?.membership_status===v?'selected':''}>${n}</option>`).join('')}</select></div>`}).join('')}<button id="saveServices" class="btn">サービス利用を保存</button></div><div class="section"><h3>スタッフ権限</h3>${!ac?'<div class="notice">ログインアカウントがないためスタッフ権限は設定できません。</div>':`<div class="field"><label>スタッフ状態</label><select id="staffStatus"><option value="none" ${!st?'selected':''}>スタッフではない</option><option value="active" ${st?.staff_status==='active'?'selected':''}>在籍</option><option value="inactive" ${st?.staff_status==='inactive'?'selected':''}>停止</option></select></div><div class="roleRow"><b>８LABO全体</b><select id="systemRole"><option value="none">権限なし</option><option value="SYSTEM_ADMIN" ${ras.some(x=>roles.find(r=>r.id===x.role_id)?.role_code==='SYSTEM_ADMIN')?'selected':''}>全体管理者</option></select></div>${services.filter(s=>['ACADEMY','BIZFIT'].includes(s.service_code)).map(s=>{const ra=ras.find(x=>x.service_id===s.id),rc=ra?roles.find(r=>r.id===ra.role_id)?.role_code:'none';return `<div class="roleRow"><b>${esc(s.service_name)}</b><select data-role-service="${s.id}"><option value="none">権限なし</option>${['SERVICE_ADMIN','SERVICE_STAFF','VIEWER'].map(v=>`<option value="${v}" ${rc===v?'selected':''}>${roleName[v]}</option>`).join('')}</select></div>`}).join('')}<button id="saveStaff" class="btn">スタッフ権限を保存</button>`}</div>`;$('savePerson').onclick=()=>savePerson(p);$('saveServices').onclick=()=>saveServices(p);if(ac&&$('saveStaff'))$('saveStaff').onclick=()=>saveStaff(p,ac)}async function savePerson(p){await sb.from('persons').update({status:$('personStatus').value,updated_at:new Date().toISOString()}).eq('id',p.id);load()}async function saveServices(p){for(const s of document.querySelectorAll('[data-service]')){const ex=members.find(x=>x.person_id===p.id&&x.service_id===s.dataset.service);if(s.value==='none'&&ex)await sb.from('service_memberships').delete().eq('id',ex.id);else if(s.value!=='none'){if(ex)await sb.from('service_memberships').update({membership_status:s.value,updated_at:new Date().toISOString()}).eq('id',ex.id);else await sb.from('service_memberships').insert({person_id:p.id,service_id:s.dataset.service,membership_status:s.value})}}load()}async function ensureStaff(p,ac){let st=staff.find(x=>x.person_id===p.id),v=$('staffStatus').value;if(v==='none'){if(st){await sb.from('staff_role_assignments').update({status:'inactive'}).eq('staff_user_id',st.id);await sb.from('staff_users').update({staff_status:'inactive'}).eq('id',st.id)}return null}if(!st){const{data}=await sb.from('staff_users').insert({person_id:p.id,auth_user_id:ac.auth_user_id,staff_status:v}).select().single();st=data}else await sb.from('staff_users').update({staff_status:v}).eq('id',st.id);return st}async function setRole(st,code,serviceId){const xs=assign.filter(x=>x.staff_user_id===st.id&&x.service_id===serviceId);for(const x of xs)if(x.status==='active')await sb.from('staff_role_assignments').update({status:'inactive'}).eq('id',x.id);if(code==='none')return;const r=roles.find(x=>x.role_code===code),old=xs.find(x=>x.role_id===r.id);if(old)await sb.from('staff_role_assignments').update({status:'active'}).eq('id',old.id);else await sb.from('staff_role_assignments').insert({staff_user_id:st.id,role_id:r.id,service_id:serviceId,status:'active'})}async function saveStaff(p,ac){const st=await ensureStaff(p,ac);if(!st)return load();await setRole(st,$('systemRole').value,null);for(const s of document.querySelectorAll('[data-role-service]'))await setRole(st,s.value,s.dataset.roleService);load()}$('search').oninput=renderPeople;boot();</script></body></html>
