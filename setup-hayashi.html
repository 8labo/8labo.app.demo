<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 管理者アカウント設定</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f8;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:26px;box-shadow:0 12px 38px rgba(15,23,42,.08)}.brand{font-size:10px;font-weight:900;letter-spacing:.16em;color:#94a3b8}h1{font-size:21px;margin:7px 0 8px}p{font-size:12px;line-height:1.75;color:#64748b}.field{margin-top:16px}label{display:block;font-size:10px;font-weight:900;color:#64748b;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #d9e0e7;border-radius:12px;font:inherit}input[readonly]{background:#f7f8fa;color:#475569}button{width:100%;margin-top:18px;border:0;border-radius:13px;background:#111827;color:#fff;padding:13px;font-weight:900}.msg{margin-top:14px;padding:11px;border-radius:11px;background:#f1f5f9;font-size:11px;line-height:1.7}.ok{background:#edf8f2;color:#287653}.err{background:#fff0f0;color:#a63f3f}.note{margin-top:15px;font-size:10px;color:#94a3b8;line-height:1.65}</style></head><body><main class="box"><div class="brand">8LABO ADMIN SETUP</div><h1>林さんの管理者アカウント登録</h1><p>通常管理者として使用するメールアドレスをSupabase Authへ登録します。パスワードはこの画面内で設定し、こちらには保存されません。</p><div class="field"><label>メールアドレス</label><input id="email" value="8labo.hayashi@gmail.com" readonly></div><div class="field"><label>新しいパスワード</label><input id="password" type="password" autocomplete="new-password" placeholder="8文字以上を推奨"></div><div class="field"><label>パスワード確認</label><input id="password2" type="password" autocomplete="new-password"></div><button id="signup">アカウントを登録</button><div id="msg" class="msg">登録すると確認メールが届く場合があります。その場合はメール内の確認リンクを開いてください。</div><div class="note">このページは初期設定用です。設定完了後に削除します。</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');const $=id=>document.getElementById(id);$('signup').onclick=async()=>{const p=$('password').value,p2=$('password2').value;if(p.length<8)return show('パスワードは8文字以上にしてください。',false);if(p!==p2)return show('確認用パスワードが一致しません。',false);$('signup').disabled=true;$('signup').textContent='登録しています…';const {data,error}=await sb.auth.signUp({email:'8labo.hayashi@gmail.com',password:p});if(error){show(error.message,false);$('signup').disabled=false;$('signup').textContent='アカウントを登録';return}show(data.session?'登録が完了しました。':'登録を受け付けました。8labo.hayashi@gmail.com に確認メールが届いている場合は、メール内のリンクを開いてください。',true);$('signup').textContent='登録済み'};function show(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}</script></body></html>
