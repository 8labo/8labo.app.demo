<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO シフト管理</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--green:#16794b;--blue:#0b4f8a;--orange:#c96b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:10}.brand{font-weight:900}.brand small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted)}.back{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:24px;padding:26px}.hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.7}.status{margin:15px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:11px;color:#4b5563}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;font-weight:850;color:#667085}.tabs button.on{background:#111827;color:#fff}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.card h2{margin:0 0 5px;font-size:17px}.sub{font-size:11px;color:var(--muted);line-height:1.65;margin:0 0 14px}.shift{border-top:1px solid #eef1f4;padding:14px 0}.shift:first-child{border-top:0}.shiftHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.shift h3{font-size:14px;margin:0}.meta{font-size:10px;color:#7b8492;margin-top:4px;line-height:1.6}.badge{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;background:#eef2f7;color:#475569}.badge.confirmed{background:#eaf7ef;color:#20704a}.badge.open{background:#eef5fb;color:#315f84}.badge.preferred{background:#fff4e8;color:#a65e13}.response{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.response button{border:1px solid #d9dfe7;background:#fff;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:800}.response button.selected{background:#111827;color:#fff;border-color:#111827}.field{margin:10px 0}.field label{display:block;font-size:10px;font-weight:800;color:#596273;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dde5;border-radius:11px;padding:10px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer}.primary{background:#111827;color:#fff}.blue{background:var(--blue);color:#fff}.light{background:#f3f4f6;color:#374151}.managerOnly{display:none}.managerOnly.show{display:block}.staffList{max-height:340px;overflow:auto}.staffRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #eef1f4}.staffRow:first-child{border-top:0}.staffRow label{font-size:11px;font-weight:800}.empty{font-size:12px;color:#9ca3af;padding:15px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:9px;color:var(--muted)}@media(max-width:760px){.grid,.row,.summary{grid-template-columns:1fr}.top{padding:0 14px}}</style></head><body><header class="top"><div class="brand">８LABO シフト管理<small>スタッフ共通</small></div><a class="back" href="staff.html">← スタッフメニューに戻る</a></header><main class="wrap"><section class="hero"><h1>シフト管理</h1><p>勤務可能日の回答、調整中シフトの確認、確定した勤務予定の確認をひとつにまとめます。</p></section><div id="status" class="status">スタッフ権限を確認しています…</div><section id="app" style="display:none"><div class="summary"><div class="stat"><b id="openCount">0</b><span>回答待ち・調整中</span></div><div class="stat"><b id="myCount">0</b><span>自分の確定シフト</span></div><div class="stat"><b id="monthCount">0</b><span>今月の確定シフト</span></div></div><div class="tabs"><button class="on" data-tab="adjust">シフト調整</button><button data-tab="confirmed">確定シフト</button><button id="managerTab" class="managerOnly" data-tab="manage">管理者用</button></div><section id="adjust" class="panel on"><div class="card"><h2>勤務可能日の回答</h2><p class="sub">「勤務可能」「できれば入りたい」「勤務不可」から選択できます。回答は後から変更できます。</p><div id="openShifts"></div></div></section><section id="confirmed" class="panel"><div class="card"><h2>確定したシフト</h2><p class="sub">自分に割り当てられた確定シフトを確認できます。</p><div id="confirmedShifts"></div></div></section><section id="manage" class="panel"><div class="grid"><div class="card"><h2>シフト枠を作成</h2><p class="sub">全体管理者またはサービス管理者が利用できます。</p><div class="field"><label>対象サービス</label><select id="mService"><option value="">８LABO共通</option></select></div><div class="field"><label>タイトル</label><input id="mTitle" placeholder="例：石井教室 指導"></div><div class="row"><div class="field"><label>日付</label><input id="mDate" type="date"></div><div class="field"><label>必要人数</label><input id="mCount" type="number" min="1" value="1"></div></div><div class="row"><div class="field"><label>開始</label><input id="mStart" type="time"></div><div class="field"><label>終了</label><input id="mEnd" type="time"></div></div><div class="field"><label>場所</label><input id="mLocation"></div><div class="field"><label>備考</label><textarea id="mNotes" rows="3"></textarea></div><button id="createShift" class="btn primary">調整用シフトを作成</button></div><div class="card"><h2>シフトを確定</h2><p class="sub">調整中シフトを選び、勤務スタッフを割り当てます。</p><div class="field"><label>シフト</label><select id="assignShift"></select></div><div id="assignStaff" class="staffList"></div><button id="confirmAssign" class="btn blue">選択したスタッフで確定</button></div></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id);let staffId=null,isManager=false,slots=[],responses=[],assignments=[],staffUsers=[],people=[],services=[];const fmtDate=d=>new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T00:00:00'));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab))});async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return setStatus('８LABOポータルでログインしてください。');const {data:sid}=await sb.rpc('current_staff_id');if(!sid)return setStatus('スタッフ権限がありません。');staffId=sid;const {data:sys}=await sb.rpc('is_system_admin');const {data:ss}=await sb.from('services').select('id,service_code,service_name').eq('status','active');services=ss||[];isManager=!!sys;if(!isManager){for(const s of services){const {data:ok}=await sb.rpc('can_manage_shifts',{target_service_id:s.id});if(ok){isManager=true;break}}}if(isManager){$('managerTab').classList.add('show');$('mService').innerHTML='<option value="">８LABO共通</option>'+services.map(s=>`<option value="${s.id}">${esc(s.service_name)}</option>`).join('')}document.getElementById('app').style.display='block';setStatus('シフト情報を読み込みました。');await loadAll()}function setStatus(t){$('status').textContent=t}async function loadAll(){let r=await sb.from('staff_shift_slots').select('*').gte('shift_date',new Date().toISOString().slice(0,10)).order('shift_date').order('start_time');slots=r.data||[];r=await sb.from('staff_shift_responses').select('*');responses=r.data||[];r=await sb.from('staff_shift_assignments').select('*');assignments=r.data||[];r=await sb.from('staff_users').select('id,person_id,staff_status').eq('staff_status','active');staffUsers=r.data||[];r=await sb.from('persons').select('id,last_name,first_name');people=r.data||[];render()}function slotName(s){const svc=services.find(x=>x.id===s.service_id);return `${fmtDate(s.shift_date)} ${s.start_time?s.start_time.slice(0,5):''}${s.end_time?'〜'+s.end_time.slice(0,5):''}｜${s.title}${svc?'｜'+svc.service_name:''}`}function render(){const myResponses=new Map(responses.filter(x=>x.staff_user_id===staffId).map(x=>[x.shift_slot_id,x]));const open=slots.filter(x=>['open','draft'].includes(x.status));$('openCount').textContent=open.length;$('openShifts').innerHTML=open.map(s=>{const r=myResponses.get(s.id);return `<div class="shift"><div class="shiftHead"><div><h3>${esc(s.title)}</h3><div class="meta">${slotName(s)}${s.location?'｜'+esc(s.location):''}<br>必要人数 ${s.required_count}名</div></div><span class="badge open">調整中</span></div><div class="response"><button data-response="preferred" data-slot="${s.id}" class="${r?.response_status==='preferred'?'selected':''}">できれば入りたい</button><button data-response="available" data-slot="${s.id}" class="${r?.response_status==='available'?'selected':''}">勤務可能</button><button data-response="unavailable" data-slot="${s.id}" class="${r?.response_status==='unavailable'?'selected':''}">勤務不可</button></div></div>`}).join('')||'<div class="empty">現在、回答が必要なシフトはありません。</div>';document.querySelectorAll('[data-response]').forEach(b=>b.onclick=()=>saveResponse(b.dataset.slot,b.dataset.response));const myAssign=assignments.filter(x=>x.staff_user_id===staffId&&x.assignment_status!=='cancelled').map(a=>({a,s:slots.find(x=>x.id===a.shift_slot_id)})).filter(x=>x.s);$('myCount').textContent=myAssign.length;const ym=new Date().toISOString().slice(0,7);$('monthCount').textContent=myAssign.filter(x=>x.s.shift_date.startsWith(ym)).length;$('confirmedShifts').innerHTML=myAssign.map(({a,s})=>`<div class="shift"><div class="shiftHead"><div><h3>${esc(s.title)}</h3><div class="meta">${slotName(s)}${s.location?'｜'+esc(s.location):''}</div></div><span class="badge confirmed">確定</span></div></div>`).join('')||'<div class="empty">確定したシフトはありません。</div>';if(isManager){$('assignShift').innerHTML=slots.filter(x=>x.status!=='cancelled').map(s=>`<option value="${s.id}">${esc(slotName(s))}</option>`).join('');renderAssignStaff()}}async function saveResponse(slot,status){const existing=responses.find(x=>x.shift_slot_id===slot&&x.staff_user_id===staffId);let q;if(existing)q=sb.from('staff_shift_responses').update({response_status:status,updated_at:new Date().toISOString()}).eq('id',existing.id);else q=sb.from('staff_shift_responses').insert({shift_slot_id:slot,staff_user_id:staffId,response_status:status});const {error}=await q;if(error)return alert(error.message);await loadAll()}function renderAssignStaff(){const slot=$('assignShift').value;if(!slot){$('assignStaff').innerHTML='<div class="empty">シフトを選択してください。</div>';return}const rs=responses.filter(x=>x.shift_slot_id===slot&&['available','preferred'].includes(x.response_status));$('assignStaff').innerHTML=staffUsers.map(st=>{const p=people.find(x=>x.id===st.person_id),r=rs.find(x=>x.staff_user_id===st.id),assigned=assignments.some(x=>x.shift_slot_id===slot&&x.staff_user_id===st.id&&x.assignment_status!=='cancelled');return `<div class="staffRow"><div><label>${esc(p?p.last_name+' '+p.first_name:'スタッフ')}</label><div class="meta">${r?.response_status==='preferred'?'希望強め':r?.response_status==='available'?'勤務可能':r?.response_status==='unavailable'?'勤務不可':'未回答'}</div></div><input type="checkbox" data-assign-staff="${st.id}" ${assigned?'checked':''}></div>`}).join('')}$('assignShift').onchange=renderAssignStaff;$('createShift').onclick=async()=>{const row={service_id:$('mService').value||null,title:$('mTitle').value.trim(),shift_date:$('mDate').value,start_time:$('mStart').value||null,end_time:$('mEnd').value||null,location:$('mLocation').value||null,required_count:+$('mCount').value||1,status:'open',notes:$('mNotes').value||null,created_by:staffId};if(!row.title||!row.shift_date)return alert('タイトルと日付は必須です。');const {error}=await sb.from('staff_shift_slots').insert(row);if(error)return alert(error.message);$('mTitle').value='';$('mDate').value='';await loadAll()};$('confirmAssign').onclick=async()=>{const slotId=$('assignShift').value;if(!slotId)return;const selected=[...document.querySelectorAll('[data-assign-staff]:checked')].map(x=>x.dataset.assignStaff);const existing=assignments.filter(x=>x.shift_slot_id===slotId);for(const a of existing){if(!selected.includes(a.staff_user_id)&&a.assignment_status!=='cancelled')await sb.from('staff_shift_assignments').update({assignment_status:'cancelled',updated_at:new Date().toISOString()}).eq('id',a.id)}for(const sid of selected){const old=existing.find(x=>x.staff_user_id===sid);if(old)await sb.from('staff_shift_assignments').update({assignment_status:'confirmed',assigned_by:staffId,assigned_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',old.id);else await sb.from('staff_shift_assignments').insert({shift_slot_id:slotId,staff_user_id:sid,assignment_status:'confirmed',assigned_by:staffId})}await sb.from('staff_shift_slots').update({status:'confirmed',updated_at:new Date().toISOString()}).eq('id',slotId);await loadAll();alert('シフトを確定しました。')};boot();</script></body></html>
