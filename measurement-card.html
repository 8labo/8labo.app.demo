<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>測定カルテ｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 900px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}.back{font-size:11px;color:var(--muted)}main{width:min(900px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{font-size:24px;margin:4px 0}.hero p{font-size:11px;color:#cbd5e1;line-height:1.7;margin:6px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.card h2{font-size:16px;margin:0 0 5px}.sub,.meta,.empty{font-size:10px;color:var(--muted);line-height:1.7}.person{padding:13px 0;border-top:1px solid #eef1f4}.person:first-of-type{border-top:0}.session{padding:15px 0;border-top:1px solid #eef1f4}.session:first-child{border-top:0}.session h3{font-size:13px;margin:0 0 4px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.result{background:#f8fafc;border:1px solid #edf1f4;border-radius:12px;padding:10px}.result b{font-size:14px;display:block}.result span{font-size:9px;color:var(--muted)}.academy{background:#eef5fb;color:#315d84;border-radius:12px;padding:11px;font-size:10px;line-height:1.7;margin-top:10px}.hidden{display:none!important}@media(max-width:650px){.results{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">測定カルテ<small>８LABO PORTAL</small></div><a class="back" href="./">← ポータルへ</a></header><main><section class="hero"><small>MEASUREMENT RECORD</small><h1>これまでの測定結果</h1><p>イベント等で測定した結果を確認できます。ACADEMY塾生の測定結果は、ACADEMYアプリのカルテにまとめて表示します。</p></section><div id="status" class="card">測定結果を読み込んでいます…</div><section id="app" class="hidden"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),fmt=n=>String(n).padStart(4,'0');function value(r,item){let v=r.numeric_value??r.text_value??(r.boolean_value===true?'はい':r.boolean_value===false?'いいえ':'—');return `${v}${r.numeric_value!=null&&item?.unit?' '+item.unit:''}`}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='ログインしてください。';return}const{data:ua}=await sb.from('user_accounts').select('person_id').eq('auth_user_id',session.user.id).maybeSingle();if(!ua){$('status').textContent='本登録を完了してください。';return}let ids=[ua.person_id];const{data:rels}=await sb.from('person_relationships').select('to_person_id').eq('from_person_id',ua.person_id).eq('relationship_type','guardian').eq('status','active').eq('can_view',true);for(const r of rels||[])if(!ids.includes(r.to_person_id))ids.push(r.to_person_id);const[{data:people},{data:services},{data:members},{data:results}]=await Promise.all([sb.from('persons').select('id,labo_id,last_name,first_name').in('id',ids),sb.from('services').select('id,service_code').eq('service_code','ACADEMY'),sb.from('service_memberships').select('person_id,service_id,membership_status').in('person_id',ids),sb.from('assessment_results').select('*').in('person_id',ids).order('created_at',{ascending:false})]);const academyId=services?.[0]?.id;const academyPeople=new Set((members||[]).filter(m=>m.service_id===academyId&&['active','trial','paused'].includes(m.membership_status)).map(m=>m.person_id));const portalPeople=(people||[]).filter(p=>!academyPeople.has(p.id)&&(results||[]).some(r=>r.person_id===p.id));if(!portalPeople.length){$('status').innerHTML='ポータルで表示する測定結果はありません。<div class="academy">ACADEMY塾生の測定結果はACADEMYアプリの「カルテ」から確認してください。</div>';return}const sessionIds=[...new Set((results||[]).map(r=>r.session_id).filter(Boolean))],itemIds=[...new Set((results||[]).map(r=>r.assessment_item_id).filter(Boolean))];const[{data:sessions},{data:items}]=await Promise.all([sessionIds.length?sb.from('assessment_sessions').select('id,session_name,assessment_date,location').in('id',sessionIds):{data:[]},itemIds.length?sb.from('assessment_items').select('id,item_name,unit,sort_order').in('id',itemIds):{data:[]}]);$('status').classList.add('hidden');$('app').classList.remove('hidden');$('app').innerHTML=portalPeople.map(p=>{const pr=(results||[]).filter(r=>r.person_id===p.id);const groups=[...new Set(pr.map(r=>r.session_id))].map(sid=>({s:(sessions||[]).find(s=>s.id===sid),rs:pr.filter(r=>r.session_id===sid)})).sort((a,b)=>String(b.s?.assessment_date||'').localeCompare(String(a.s?.assessment_date||'')));return `<section class="card"><h2>${esc(p.last_name+' '+p.first_name)}</h2><div class="sub">８LABO ID ${fmt(p.labo_id)}</div>${groups.map(g=>`<div class="session"><h3>${esc(g.s?.session_name||'測定')}</h3><div class="meta">${esc(g.s?.assessment_date||'日付未設定')}${g.s?.location?'｜'+esc(g.s.location):''}</div><div class="results">${g.rs.sort((a,b)=>((items||[]).find(i=>i.id===a.assessment_item_id)?.sort_order||999)-((items||[]).find(i=>i.id===b.assessment_item_id)?.sort_order||999)).map(r=>{const it=(items||[]).find(i=>i.id===r.assessment_item_id);return `<div class="result"><span>${esc(it?.item_name||'測定項目')}</span><b>${esc(value(r,it))}</b></div>`}).join('')}</div></div>`).join('')}</section>`}).join('')}boot();</script></body></html>
