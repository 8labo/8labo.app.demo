<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テスト会員｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 980px)/2))}a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:26px 0 60px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px}.hero h1{margin:4px 0;font-size:24px}.hero p{margin:0;color:#cbd5e1;font-size:11px;line-height:1.7}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.scenario{padding:13px 0;border-top:1px solid #eef1f4;cursor:pointer}.scenario:first-child{border-top:0}.scenario b{font-size:12px}.scenario p{font-size:10px;color:var(--muted);margin:4px 0 0}.scenario.on b{color:#0f5d9b}.previewbar{background:#fff4d8;border:1px solid #efd89a;border-radius:12px;padding:10px;font-size:10px;font-weight:800}.portal{margin-top:12px;background:#111827;color:#fff;border-radius:20px;padding:22px}.portal small{color:#cbd5e1}.portal h2{margin:5px 0}.service{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.badge{font-size:9px;font-weight:900;padding:4px 7px;border-radius:999px;background:#eef8f3}.muted{font-size:10px;color:var(--muted);line-height:1.6}.child{padding:10px 0;border-top:1px solid #eef1f4}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>８LABO テスト会員</b><a href="portal-admin.html">← ポータル管理へ</a></header><main class="wrap"><section class="hero"><small>TEST MEMBER PREVIEW</small><h1>代表的な会員パターンを確認</h1><p>実在人物や会員数には加算しない開発用の仮想会員です。新機能公開前の表示確認に使います。</p></section><div class="grid"><section class="card" id="scenarios"></section><section class="card"><div class="previewbar">テストプレビューモード｜データ更新は行われません</div><div id="view"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);const cases=[{id:'academy1',name:'ACADEMY保護者＋子ども1人',desc:'最も基本的なACADEMY家庭',person:'テスト 保護者A',services:['ACADEMY'],children:['テスト こどもA']},{id:'academy2',name:'ACADEMY保護者＋兄弟2人',desc:'兄弟登録時の表示確認',person:'テスト 保護者B',services:['ACADEMY'],children:['テスト こどもB1','テスト こどもB2']},{id:'bizfit',name:'BizFitのみ',desc:'大人1名・BizFit単独利用',person:'テスト 会員C',services:['BizFitクラブ'],children:[]},{id:'both',name:'ACADEMY＋BizFit',desc:'複数サービス利用者',person:'テスト 会員D',services:['ACADEMY','BizFitクラブ'],children:['テスト こどもD']},{id:'none',name:'サービス未利用',desc:'IDだけ発行された状態',person:'テスト 会員E',services:[],children:[]}];let current=cases[0];function renderList(){$('scenarios').innerHTML=cases.map(x=>`<div class="scenario ${x.id===current.id?'on':''}" data-id="${x.id}"><b>${x.name}</b><p>${x.desc}</p></div>`).join('');document.querySelectorAll('.scenario').forEach(x=>x.onclick=()=>{current=cases.find(c=>c.id===x.dataset.id);renderList();renderView()})}function renderView(){const s=current.services.length?current.services.map(x=>`<div class="service"><b>${x}</b> <span class="badge">利用中</span><div class="muted">会員ポータルにサービス入口が表示される想定です。</div></div>`).join(''):'<div class="service"><b>利用中のサービスはありません</b><div class="muted">サービス申込や案内への導線だけを表示するケースです。</div></div>';const c=current.children.length?current.children.map(x=>`<div class="child"><b>${x}</b><div class="muted">保護者から参照可能</div></div>`).join(''):'<div class="muted" style="margin-top:12px">表示対象のお子さまはいません。</div>';$('view').innerHTML=`<div class="portal"><small>８LABO PORTAL</small><h2>${current.person}</h2><small>TEST ID</small></div><h3 style="font-size:14px;margin-top:18px">利用中のサービス</h3>${s}<h3 style="font-size:14px;margin-top:18px">家族・お子さま</h3>${c}`}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('view').innerHTML='<div class="muted">管理者としてログインしてください。</div>';return}const{data:ok}=await sb.rpc('is_system_admin');if(!ok){$('view').innerHTML='<div class="muted">全体管理者のみ利用できます。</div>';return}renderList();renderView()}boot();</script></body></html>
