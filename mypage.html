<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO マイページ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--line:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 760px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}.back{font-size:11px;color:var(--muted);text-decoration:none}main{width:min(760px,calc(100% - 32px));margin:auto;padding:30px 0}.id,.card{border-radius:22px}.id{background:#111827;color:#fff;padding:28px}.id small{color:#94a3b8}.id b{display:block;font-size:38px;margin:8px 0}.card{background:#fff;border:1px solid var(--line);padding:22px;margin-top:14px}.card h2{font-size:17px;margin:0 0 12px}.row{padding:12px 0;border-top:1px solid #eef1f4;font-size:13px}.row:first-of-type{border-top:0}.label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.hidden{display:none!important}.logout-row{display:flex;justify-content:flex-end;padding-top:18px}.logout{appearance:none;border:1px solid #d7dce2;background:#fff;color:#4b5563;border-radius:10px;padding:9px 14px;font-size:12px;font-weight:800;cursor:pointer}.logout:active{background:#f3f4f6}.logout:disabled{opacity:.55;cursor:default}</style></head><body><header class="top"><div class="brand">８LABO マイページ<small>共通アカウント</small></div><a class="back" href="./">← ポータルへ</a></header><main><section class="id"><small>８LABO ID</small><b id="id">----</b><div id="name">確認しています…</div></section><section class="card"><h2>アカウント情報</h2><div class="row"><span class="label">氏名</span><span id="name2">—</span></div><div class="row"><span class="label">ログイン状態</span>利用中</div><div class="logout-row"><button id="logout" class="logout" type="button">ログアウト</button></div></section><section id="staff" class="card hidden"><h2>スタッフメニュー</h2><div class="row"><a href="staff.html" style="color:#111827;font-weight:800;text-decoration:none">８LABO 管理メニューへ →</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const c=EIGHTLABO_CONFIG,sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=id=>document.getElementById(id),fmt=n=>String(n).padStart(4,'0');async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';const {data:a}=await sb.from('user_accounts').select('person_id').eq('auth_user_id',session.user.id).single();const {data:p}=await sb.from('persons').select('labo_id,last_name,first_name').eq('id',a.person_id).single();$('id').textContent=fmt(p.labo_id);$('name').textContent=`${p.last_name} ${p.first_name} さん`;$('name2').textContent=`${p.last_name} ${p.first_name}`;const {data:s}=await sb.rpc('current_staff_id');if(s)$('staff').classList.remove('hidden')}async function logout(){const btn=$('logout');btn.disabled=true;btn.textContent='ログアウト中…';const {error}=await sb.auth.signOut();if(error){btn.disabled=false;btn.textContent='ログアウト';alert('ログアウトできませんでした。時間をおいてもう一度お試しください。');return}location.href='./'}$('logout').addEventListener('click',logout);boot();</script></body></html>
