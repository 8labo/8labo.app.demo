<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>事務局アカウント初期設定｜８LABO</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100vw - 680px)/2))}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:var(--muted)}main{width:min(680px,calc(100% - 28px));margin:auto;padding:30px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:25px}.hero h1{margin:0 0 8px;font-size:23px}.hero p{margin:0;color:#cbd5e1;font-size:12px;line-height:1.8}.card{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:900;color:#596579;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d7dde4;border-radius:11px;font-size:14px}.btn{width:100%;border:0;border-radius:12px;background:#111827;color:#fff;padding:13px;font-weight:900;cursor:pointer}.status{margin-top:12px;padding:12px;border-radius:12px;font-size:11px;line-height:1.7;background:#f8fafc}.ok{background:#f0fdf4;color:#166534}.err{background:#fef2f2;color:#991b1b}</style></head><body><header><div class="brand">８LABO<small>事務局アカウント初期設定</small></div></header><main><section class="hero"><h1>事務局アカウントの初期設定</h1><p>このアカウントには８LABO IDは発行されません。管理者が設定した業務権限の範囲で利用します。</p></section><section class="card"><div class="field"><label>新しいパスワード</label><input id="pw1" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>パスワード（確認）</label><input id="pw2" type="password" minlength="8" autocomplete="new-password"></div><button id="save" class="btn">パスワードを設定して利用開始</button><div id="status" class="status">招待情報を確認しています…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=id=>document.getElementById(id);async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='招待リンクを確認できません。メール内の最新の招待リンクからもう一度開いてください。';$('status').className='status err';$('save').disabled=true;return}const{data:office}=await sb.from('office_accounts').select('display_name,login_email,status').eq('auth_user_id',session.user.id).maybeSingle();if(!office){$('status').textContent='この認証アカウントは事務局アカウントに接続されていません。';$('status').className='status err';$('save').disabled=true;return}$('status').textContent=`${office.display_name}（${office.login_email||session.user.email}）として設定します。`}$('save').onclick=async()=>{const a=$('pw1').value,b=$('pw2').value;if(a.length<8){$('status').textContent='パスワードは8文字以上で設定してください。';$('status').className='status err';return}if(a!==b){$('status').textContent='確認用パスワードが一致しません。';$('status').className='status err';return}$('save').disabled=true;const{error}=await sb.auth.updateUser({password:a});if(error){$('status').textContent='パスワードを設定できませんでした：'+error.message;$('status').className='status err';$('save').disabled=false;return}$('status').textContent='設定が完了しました。スタッフメニューへ移動します。';$('status').className='status ok';setTimeout(()=>location.href='staff.html',900)};boot();</script></body></html>
