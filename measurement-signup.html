<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>８LABO 測定イベント申込</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f6f8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--blue:#0b4f8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 760px)/2))}header b{font-size:17px}header a{font-size:11px;color:var(--muted);text-decoration:none}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:22px 0 70px}.hero{background:#111827;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{font-size:22px;margin:0 0 7px}.hero p{font-size:11px;line-height:1.7;color:#cbd5e1;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 4px}.sub,.hint{font-size:10px;color:var(--muted);line-height:1.65}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:850;color:#596579;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e0e7;border-radius:10px;background:#fff}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.profile{padding:11px;border-radius:12px;background:#f8fafc;border:1px solid #e7ebef;font-size:11px;line-height:1.7}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;background:#111827;color:#fff;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{padding:11px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:11px;margin-bottom:12px}.ok{background:#f0fdf4;color:#166534}.err{background:#fef2f2;color:#991b1b}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:3px}@media(max-width:640px){.row2{grid-template-columns:1fr}}</style></head><body><header><b>８LABO 測定イベント申込</b><a href="./">← ポータルへ</a></header><main class="wrap"><section class="hero"><h1>申込と一緒に、現在のスポーツ情報を確認します。</h1><p>測定結果をより適切に分析するため、競技・活動頻度・チーム内での状況などを測定会ごとに確認します。</p></section><div id="status" class="status">情報を読み込んでいます…</div><form id="form" class="hidden"><section class="card"><h2>参加者</h2><p class="sub">ご本人または登録済みのお子さまを選択してください。</p><div class="field"><label>参加者</label><select id="person"></select></div><div id="personSummary" class="profile"></div></section><section class="card"><h2>測定イベント・希望時間</h2><div class="field"><label>測定イベント</label><select id="session"></select></div><div class="row2"><div class="field"><label>参加時間 第1希望</label><select id="slot1"></select></div><div class="field"><label>参加時間 第2希望</label><select id="slot2"></select></div></div></section><section class="card"><h2>学校・連絡先</h2><div class="row2"><div class="field"><label>学校名</label><input id="school" placeholder="例：○○小学校"></div><div class="field"><label>学年</label><select id="grade"><option value="">選択してください</option><option>年少</option><option>年中</option><option>年長</option><option>小学1年</option><option>小学2年</option><option>小学3年</option><option>小学4年</option><option>小学5年</option><option>小学6年</option><option>中学1年</option><option>中学2年</option><option>中学3年</option><option>高校1年</option><option>高校2年</option><option>高校3年</option><option>その他</option></select></div></div><div class="row2"><div class="field"><label>電話番号（保護者）</label><input id="phone" type="tel"></div><div class="field"><label>メールアドレス</label><input id="email" type="email"></div></div></section><section class="card"><h2>現在のスポーツプロフィール</h2><p class="sub">毎回、申込時点の最新情報として確認します。前回と同じ場合はそのままで構いません。</p><div class="field"><label>現在行っている主な競技</label><input id="sport" placeholder="例：サッカー / 競技活動なし"></div><div class="field"><label>その他に行っている競技（任意）</label><input id="otherSports" placeholder="複数ある場合は「水泳、陸上」のように入力"></div><div class="row2"><div class="field"><label>競技歴（年）</label><input id="years" type="number" min="0" max="30" step="0.5"></div><div class="field"><label>活動頻度（週）</label><input id="frequency" type="number" min="0" max="14" step="0.5"></div></div><div class="row2"><div class="field"><label>週の活動時間（目安）</label><input id="hours" type="number" min="0" max="60" step="0.5"></div><div class="field"><label>所属チーム・クラブ（任意）</label><input id="club"></div></div><div class="row2"><div class="field"><label>チーム内での状況</label><select id="teamStatus"><option value="">選択してください</option><option value="regular">レギュラー・主力</option><option value="rotation">準レギュラー・交代出場が多い</option><option value="non_regular">非レギュラー</option><option value="individual">個人競技・該当なし</option><option value="recreational">競技目的ではない</option></select></div><div class="field"><label>競技・大会レベル</label><select id="competition"><option value="">選択してください</option><option value="recreational">レクリエーション・健康目的</option><option value="local">地域・市町大会</option><option value="prefectural">県大会</option><option value="regional">四国・地区大会</option><option value="national">全国大会</option><option value="other">その他・該当なし</option></select></div></div><div class="field"><label>ポジション・種目（任意）</label><input id="position" placeholder="例：MF / 100m / シングルス"></div></section><section class="card"><h2>その他</h2><div class="field"><label>このイベントをどのように知りましたか？</label><select id="referral"><option value="">選択してください</option><option>Instagram</option><option>公式LINE</option><option>８LABOホームページ・ポータル</option><option>学校・園からの案内</option><option>チーム・指導者からの案内</option><option>知人・友人からの紹介</option><option>以前参加したことがある</option><option>その他</option></select></div><div class="field"><label>その他記入欄</label><textarea id="notes" rows="4"></textarea></div><label class="check"><input id="confirmProfile" type="checkbox"><span class="hint">入力した学校・スポーツ情報を、今回の測定日時点のプロフィールとして８LABO IDに紐付けて保存することを確認しました。</span></label><div style="margin-top:15px"><button id="submit" class="btn" type="submit">この内容で申し込む</button></div></section></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(EIGHTLABO_CONFIG.supabaseUrl,EIGHTLABO_CONFIG.supabasePublishableKey),$=x=>document.getElementById(x);let current,people=[],sessions=[],slots=[],sportVersions=[],sportSports=[],schoolVersions=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,c=''){$('status').textContent=t;$('status').className='status '+c}function fmt(n){return String(n).padStart(4,'0')}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){msg('８LABOポータルへログインしてからお申し込みください。','err');return}const{data:pid}=await sb.rpc('current_person_id');if(!pid){msg('人物情報を確認できませんでした。','err');return}current=pid;let{data:self}=await sb.from('persons').select('*').eq('id',pid).single();people=[self];let{data:rels}=await sb.from('person_relationships').select('to_person_id').eq('from_person_id',pid).eq('relationship_type','guardian').eq('status','active');if(rels?.length){let{data:kids}=await sb.from('persons').select('*').in('id',rels.map(r=>r.to_person_id));people.push(...(kids||[]))}let r=await sb.from('assessment_sessions').select('*').eq('registration_status','open').order('assessment_date');sessions=r.data||[];r=await sb.from('assessment_event_time_slots').select('*').eq('status','active').order('sort_order');slots=r.data||[];r=await sb.from('person_sport_profile_versions').select('*').in('person_id',people.map(p=>p.id)).order('effective_from',{ascending:false}).order('created_at',{ascending:false});sportVersions=r.data||[];if(sportVersions.length){r=await sb.from('person_sport_profile_sports').select('*').in('profile_version_id',sportVersions.map(v=>v.id));sportSports=r.data||[]}r=await sb.from('person_school_profile_versions').select('*').in('person_id',people.map(p=>p.id)).order('effective_from',{ascending:false}).order('created_at',{ascending:false});schoolVersions=r.data||[];$('person').innerHTML=people.map(p=>`<option value="${p.id}">${esc(p.last_name)} ${esc(p.first_name)}｜ID ${fmt(p.labo_id)}</option>`).join('');$('session').innerHTML=sessions.length?sessions.map(s=>`<option value="${s.id}">${s.assessment_date}｜${esc(s.session_name)}</option>`).join(''):'<option value="">現在受付中の測定イベントはありません</option>';if(!sessions.length){msg('現在、ポータルで受付中の測定イベントはありません。','err');return}$('form').classList.remove('hidden');$('person').value=people[0].id;renderPerson();renderSlots();msg('申込内容を入力してください。','ok')}function latest(arr,pid){return arr.find(x=>x.person_id===pid)||null}function renderPerson(){const p=people.find(x=>x.id===$('person').value),sv=latest(sportVersions,p.id),sc=latest(schoolVersions,p.id);$('personSummary').innerHTML=`<b>${esc(p.last_name)} ${esc(p.first_name)}</b>｜８LABO ID ${fmt(p.labo_id)}<br>フリガナ：${esc((p.last_name_kana||'')+' '+(p.first_name_kana||''))}｜生年月日：${p.birth_date||'未登録'}｜性別：${esc(p.gender||'未登録')}`;$('school').value=sc?.school_name||'';$('grade').value=sc?.grade_label||'';const main=sv?sportSports.find(x=>x.profile_version_id===sv.id&&x.is_primary):null,others=sv?sportSports.filter(x=>x.profile_version_id===sv.id&&!x.is_primary):[];$('sport').value=main?.sport_name||'';$('otherSports').value=others.map(x=>x.sport_name).join('、');$('years').value=main?.years_experience??'';$('frequency').value=sv?.activity_frequency_per_week??'';$('hours').value=sv?.weekly_activity_hours??'';$('club').value=main?.club_name||'';$('teamStatus').value=sv?.team_status||'';$('competition').value=sv?.competition_level||'';$('position').value=main?.position_name||'';const me=people.find(x=>x.id===current);$('phone').value=me?.phone||'';$('email').value=me?.email||''}function renderSlots(){const a=slots.filter(x=>x.session_id===$('session').value);const options='<option value="">選択してください</option>'+a.map(x=>`<option value="${x.id}">${esc(x.label)}${x.start_time?' '+x.start_time.slice(0,5):''}${x.end_time?'〜'+x.end_time.slice(0,5):''}</option>`).join('');$('slot1').innerHTML=options;$('slot2').innerHTML=options}$('person').onchange=renderPerson;$('session').onchange=renderSlots;$('form').onsubmit=async e=>{e.preventDefault();if(!$('session').value||!$('slot1').value)return alert('測定イベントと第1希望時間を選択してください。');if($('slot2').value&&$('slot1').value===$('slot2').value)return alert('第1希望と第2希望は別の時間を選択してください。');if(!$('confirmProfile').checked)return alert('プロフィール情報の保存確認にチェックしてください。');const personId=$('person').value,sess=sessions.find(x=>x.id===$('session').value);$('submit').disabled=true;try{const{data:pv,error:pe}=await sb.from('person_sport_profile_versions').insert({person_id:personId,effective_from:sess.assessment_date,source_type:'assessment_signup',activity_frequency_per_week:$('frequency').value||null,weekly_activity_hours:$('hours').value||null,team_status:$('teamStatus').value||null,competition_level:$('competition').value||null}).select('id').single();if(pe)throw pe;const sports=[];const main=$('sport').value.trim();if(main)sports.push({profile_version_id:pv.id,sport_name:main,is_primary:true,years_experience:$('years').value||null,club_name:$('club').value.trim()||null,position_name:$('position').value.trim()||null});$('otherSports').value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean).forEach(n=>sports.push({profile_version_id:pv.id,sport_name:n,is_primary:false}));if(sports.length){const{error}=await sb.from('person_sport_profile_sports').insert(sports);if(error)throw error}const{data:school,error:se}=await sb.from('person_school_profile_versions').insert({person_id:personId,effective_from:sess.assessment_date,school_name:$('school').value.trim()||null,grade_label:$('grade').value||null,source_type:'assessment_signup'}).select('id').single();if(se)throw se;const row={session_id:sess.id,person_id:personId,sport_profile_version_id:pv.id,school_profile_version_id:school.id,first_choice_slot_id:$('slot1').value,second_choice_slot_id:$('slot2').value||null,guardian_phone:$('phone').value.trim()||null,contact_email:$('email').value.trim()||null,referral_source:$('referral').value||null,other_notes:$('notes').value.trim()||null,status:'applied',updated_at:new Date().toISOString()};const{error:re}=await sb.from('assessment_registrations').upsert(row,{onConflict:'session_id,person_id'});if(re)throw re;msg('お申し込みを受け付けました。スポーツプロフィールも最新情報として保存しました。','ok');window.scrollTo({top:0,behavior:'smooth'})}catch(err){msg('登録できませんでした：'+err.message,'err')}finally{$('submit').disabled=false}};boot();</script></body></html>
